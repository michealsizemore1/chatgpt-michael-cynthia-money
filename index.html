/* ============================== SUBSCRIPTIONS ============================== */

const CADENCE_OPTIONS = ["Monthly", "Quarterly", "Semi-Annual", "Annual"];
const CADENCE_PER_YEAR = { Monthly: 12, Quarterly: 4, "Semi-Annual": 2, Annual: 1 };
const CADENCE_SUFFIX = { Monthly: "/mo", Quarterly: "/qtr", "Semi-Annual": " (semi-annual)", Annual: "/yr" };

function subCadence(s) { return s.cadence || "Monthly"; }
function subYearlyAmount(s) { return s.amount * (CADENCE_PER_YEAR[subCadence(s)] || 12); }
function subMonthlyEquivalent(s) { return subYearlyAmount(s) / 12; }

// Whether a subscription actually bills in a given calendar month. Monthly ones always do.
// Quarterly/Semi-Annual/Annual ones only recur every 3/6/12 months from their last billed
// date (from priceHistory), so e.g. an Annual subscription last charged in April should only
// show on the calendar in April of each year — not every month.
function subDueInMonth(s, year, month) {
  const cadence = subCadence(s);
  if (cadence === "Monthly") return true;
  const last = s.priceHistory && s.priceHistory.length ? s.priceHistory[s.priceHistory.length - 1].date : null;
  if (!last) return true;
  const [ly, lm] = last.split("-").map(Number);
  const interval = cadence === "Quarterly" ? 3 : cadence === "Semi-Annual" ? 6 : 12;
  const monthsDiff = (year - ly) * 12 + (month - lm);
  return ((monthsDiff % interval) + interval) % interval === 0;
}

function subscriptionScheduleLabel(s) {
  const cadence = subCadence(s);
  if (cadence === "Monthly") {
    return `Bills on the ${s.dayOfMonth}${s.dayOfMonth === 1 ? "st" : "th"} · ${s.category}`;
  }
  const last = s.priceHistory && s.priceHistory.length ? s.priceHistory[s.priceHistory.length - 1].date : null;
  const cadenceText = cadence === "Quarterly" ? "quarterly" : cadence === "Semi-Annual" ? "twice a year" : "yearly";
  return `Bills ${cadenceText}${last ? " · last charged " + fmtDate(last) : ""} · ${s.category}`;
}

function deriveSubDate(src) {
  if (!src) return todayISO();
  if (src.date) return src.date;
  if (src.priceHistory && src.priceHistory.length) return src.priceHistory[src.priceHistory.length - 1].date;
  if (src.dayOfMonth) {
    const base = new Date(todayISO() + "T00:00:00");
    const day = Math.min(src.dayOfMonth, daysInMonth(base.getFullYear(), base.getMonth() + 1));
    return isoDate(base.getFullYear(), base.getMonth() + 1, day);
  }
  return todayISO();
}

function SubscriptionModal({ open, onClose, onSave, onDelete, initial, prefill }) {
  const blank = { merchant: "", category: "Subscriptions", amount: "", cadence: "Monthly", date: todayISO(), person: "Joint", active: true };
  const [form, setForm] = useState(blank);

  useEffect(() => {
    if (!open) return;
    const src = initial || prefill;
    setForm(src ? {
      merchant: src.merchant || "", category: src.category || "Subscriptions",
      amount: src.amount != null ? String(Math.abs(src.amount)) : "", cadence: src.cadence || "Monthly",
      date: deriveSubDate(src), person: src.person || "Joint", active: src.active !== false,
    } : blank);
  }, [open, initial, prefill]);

  const submit = (e) => {
    e.preventDefault();
    if (!form.merchant || form.amount === "" || !form.date) return;
    const amount = parseFloat(form.amount) || 0;
    const dayOfMonth = Math.min(31, Math.max(1, new Date(form.date + "T00:00:00").getDate()));
    if (initial) {
      const priceHistory = initial.priceHistory && initial.priceHistory.length ? initial.priceHistory : [{ date: form.date, amount }];
      const lastIdx = priceHistory.length - 1;
      const lastEntry = priceHistory[lastIdx];
      const nextHistory = lastEntry.amount !== amount
        ? [...priceHistory, { date: form.date, amount }]
        : priceHistory.map((h, i) => i === lastIdx ? { ...h, date: form.date } : h);
      onSave({ ...initial, merchant: form.merchant, category: form.category, amount, cadence: form.cadence, dayOfMonth, person: form.person, active: form.active, priceHistory: nextHistory });
    } else {
      onSave({
        id: uid(), merchant: form.merchant, category: form.category, amount, cadence: form.cadence,
        dayOfMonth, person: form.person, active: form.active, priceHistory: [{ date: form.date, amount }],
      });
    }
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Subscription" : prefill ? "Mark as Subscription" : "Add Subscription"}>
      <form onSubmit={submit}>
        <Field label="Merchant">
          <input className={inputClass} value={form.merchant} onChange={e => setForm({ ...form, merchant: e.target.value })} required />
        </Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Amount ($ per charge)">
            <input type="number" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
          </Field>
          <Field label="Cadence">

function Subscriptions({ data, actions }) {
  const active = data.subscriptions.filter(s => s.active);
  const cancelled = data.subscriptions.filter(s => !s.active);
  const monthlyTotal = active.reduce((s, x) => s + subMonthlyEquivalent(x), 0);
  const yearlyTotal = active.reduce((s, x) => s + subYearlyAmount(x), 0);

  const priceIncreases = active.filter(s => s.priceHistory.length > 1);
  const cancelledYearlySavings = cancelled.reduce((s, x) => s + subYearlyAmount(x), 0);
  const cancelledMonthlySavings = cancelledYearlySavings / 12;

  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const openAdd = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (s) => { setEditing(s); setModalOpen(true); };
  const closeModal = () => setModalOpen(false);
  const saveSub = (s) => {
    if (editing) actions.updateSubscription(s);
    else actions.addSubscription(s);
    setModalOpen(false);
  };
  const deleteSub = (id) => {
    actions.deleteSubscription(id);
    setModalOpen(false);

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">

          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Subscriptions &amp; Bills</h1>

        </div>

      <SectionNotes section="subscriptions" data={data} actions={actions} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5">
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Active Subscriptions</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{active.length}</div>

          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Monthly Cost</div>

          <div className="text-xs text-slate-400 font-medium mt-1">Averaged across cadences</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Projected Yearly Cost</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(yearlyTotal, { decimals: false })}</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Saved by Cancelling</div>

        <Card className="p-5 border-amber-200 bg-amber-50/50">
          <h3 className="font-semibold text-amber-800 text-sm mb-2">⚠️ Price increases detected</h3>
          {priceIncreases.map(s => {
            const prev = s.priceHistory[s.priceHistory.length - 2];

              <div key={s.id} className="text-sm text-amber-700">

function BillCalendar({ year, month, items, todayDay, onDayClick }) {
  const dim = daysInMonth(year, month);
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);
  const itemsByDay = {};
  items.forEach(it => { itemsByDay[it.dayOfMonth] = itemsByDay[it.dayOfMonth] || []; itemsByDay[it.dayOfMonth].push(it); });

  return (
    <div className="overflow-x-auto">
      <div className="grid grid-cols-7 gap-1.5 md:gap-2 text-xs min-w-[560px]">
        {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => <div key={d} className="text-center font-medium text-slate-400 pb-1">{d}</div>)}
        {cells.map((d, i) => {
          const dayItems = d ? (itemsByDay[d] || []) : [];
          return (
            <button
              key={i}
              type="button"
              disabled={!d}
              onClick={() => d && onDayClick(d, dayItems)}
              className={"min-h-[84px] rounded-lg border p-1.5 text-left align-top block w-full " + (d ? "hover:border-indigo-300 hover:shadow-sm cursor-pointer transition-all " : "cursor-default ") + (d === todayDay ? "border-indigo-400 bg-indigo-50" : "border-slate-100")}
            >
              {d && <div className={"text-[11px] font-semibold " + (d === todayDay ? "text-indigo-600" : "text-slate-400")}>{d}</div>}
              {d && dayItems.slice(0, 3).map((it, idx) => (
                <div
                  key={idx}
                  title={it.merchant + " · " + fmtCurrency(it.amount) + (it.paid ? " · Paid" : "")}
                  className={"mt-0.5 truncate rounded px-1 py-0.5 flex items-center gap-0.5 " + (it.income ? "bg-emerald-50 text-emerald-700" : it.paid ? "bg-slate-100 text-slate-400 line-through" : "bg-rose-50 text-rose-700")}
                >
                  {!it.income && it.paid && <span className="shrink-0">✓</span>}
                  <span className="truncate">{it.income ? "+" : "-"}${Math.round(Math.abs(it.amount))} {it.merchant}</span>
                </div>
              ))}
              {d && dayItems.length > 3 && (
                <div className="text-[10px] text-slate-400 mt-0.5">+{dayItems.length - 3} more — tap to see all</div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const CASHFLOW_REAL_TODAY = { year: 2026, month: 7, day: 27 };

function CashFlow({ data, derived, actions }) {
  const [viewYear, setViewYear] = useState(CASHFLOW_REAL_TODAY.year);
  const [viewMonth, setViewMonth] = useState(CASHFLOW_REAL_TODAY.month);
  const [selectedDay, setSelectedDay] = useState(null);

  const isCurrentMonth = viewYear === CASHFLOW_REAL_TODAY.year && viewMonth === CASHFLOW_REAL_TODAY.month;
  const todayDay = isCurrentMonth ? CASHFLOW_REAL_TODAY.day : -1;
  const viewMonthKey = `${viewYear}-${pad(viewMonth)}`;
  const dimView = daysInMonth(viewYear, viewMonth);

  // Recurring bills/subscriptions repeat every month on their day (clamped to the viewed
  // month's length), with paid status looked up per the viewed month specifically — not
  // tied to the real current month like derived.recurringItems is.
  const paidForViewMonth = (data.paidBills && data.paidBills[viewMonthKey]) || {};
  const items = [
    ...(data.recurringBills || []).map(b => ({ id: b.id, merchant: b.merchant, amount: b.amount, dayOfMonth: Math.min(b.dayOfMonth, dimView), category: b.category, paid: !!paidForViewMonth[b.id], income: false })),
    ...data.subscriptions.filter(s => s.active && subDueInMonth(s, viewYear, viewMonth)).map(s => ({ id: s.id, merchant: s.merchant, amount: s.amount, dayOfMonth: Math.min(s.dayOfMonth, dimView), category: s.category, paid: !!paidForViewMonth[s.id], income: false })),
    ...data.transactions.filter(t => t.category === "Income" && monthKey(t.date) === viewMonthKey).map(t => ({ merchant: t.merchant, amount: t.amount, dayOfMonth: new Date(t.date + "T00:00:00").getDate(), income: true })),
  ];

  // "Still due this month" and Safe to Spend always reflect the real current month,
  // regardless of which month the calendar above is browsing.
  const upcoming = derived.recurringItems.filter(b => b.dayOfMonth > CASHFLOW_REAL_TODAY.day).sort((a, b) => a.dayOfMonth - b.dayOfMonth);

  // Recomputed live from `items` on every render (not a frozen snapshot), so the paid
  // checkbox in the modal stays in sync immediately after toggling.
  const selectedItems = selectedDay != null ? items.filter(it => it.dayOfMonth === selectedDay) : [];
  const openDay = (day) => setSelectedDay(day);

  const monthLabel = new Date(viewYear, viewMonth - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const goPrevMonth = () => {
    setSelectedDay(null);
    if (viewMonth === 1) { setViewMonth(12); setViewYear(y => y - 1); } else setViewMonth(m => m - 1);
  };
  const goNextMonth = () => {
    setSelectedDay(null);
    if (viewMonth === 12) { setViewMonth(1); setViewYear(y => y + 1); } else setViewMonth(m => m + 1);
  };
  const goToday = () => { setSelectedDay(null); setViewYear(CASHFLOW_REAL_TODAY.year); setViewMonth(CASHFLOW_REAL_TODAY.month); };

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Cash Flow</h1>
        <p className="text-slate-500 text-sm mt-1">What's safe to spend before your next bills hit, and when everything is due.</p>
      </div>

      <SectionNotes section="cashflow" data={data} actions={actions} />

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-1">Safe to Spend</h3>
          <div className={"text-3xl font-bold mt-2 " + (derived.safeToSpend >= 0 ? "text-slate-800" : "text-rose-600")}>{fmtCurrency(derived.safeToSpend, { decimals: false })}</div>
          <div className="mt-4 space-y-2 text-sm border-t border-slate-100 pt-4">
            <div className="flex justify-between"><span className="text-slate-500">Checking balance</span><span className="font-medium text-slate-700">{fmtCurrency((derived.checkingAccount && derived.checkingAccount.balance) || 0, { decimals: false })}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Upcoming bills (rest of month)</span><span className="font-medium text-rose-600">-{fmtCurrency(derived.upcomingBillsRemaining, { decimals: false })}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-100">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Still due this month</div>
            <div className="space-y-2 max-h-56 overflow-y-auto no-scrollbar">
              {upcoming.length === 0 && <div className="text-sm text-slate-400">Nothing left — you're all paid up! 🎉</div>}
              {upcoming.map((b, i) => (
                <label key={b.id || i} className="flex items-center justify-between gap-2 text-sm cursor-pointer">
                  <span className="flex items-center gap-2 min-w-0">
                    <input
                      type="checkbox"
                      checked={!!b.paid}
                      onChange={() => b.id && actions.toggleBillPaid(derived.curMonth, b.id)}
                      className="w-3.5 h-3.5 accent-emerald-600 shrink-0"
                    />
                    <span className={"truncate " + (b.paid ? "text-slate-400 line-through" : "text-slate-600")}>{b.merchant}</span>
                  </span>
                  <span className={"font-medium shrink-0 " + (b.paid ? "text-slate-400" : "text-slate-700")}>{fmtCurrency(b.amount)}</span>
                </label>
              ))}
            </div>
          </div>
        </Card>
        <Card className="md:col-span-2 p-6">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="font-semibold text-slate-700">{monthLabel} Bill Calendar</h3>
            <div className="flex items-center gap-1.5">
              {!isCurrentMonth && (
                <button type="button" onClick={goToday} className="text-xs text-indigo-600 font-medium mr-1">Today</button>
              )}
              <button type="button" onClick={goPrevMonth} title="Previous month" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 flex items-center justify-center">‹</button>
              <button type="button" onClick={goNextMonth} title="Next month" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 flex items-center justify-center">›</button>
            </div>
          </div>
          <p className="text-xs text-slate-400 -mt-1 mb-3">Tap any day to see full details and check off bills as paid.</p>
          <BillCalendar year={viewYear} month={viewMonth} items={items} todayDay={todayDay} onDayClick={openDay} />
        </Card>
      </div>

      <DayDetailModal
        open={selectedDay != null}
        onClose={() => setSelectedDay(null)}
        day={selectedDay}
        items={selectedItems}
        monthKey={viewMonthKey}
        actions={actions}
      />
    </div>
  );
}

function InvestmentAllocation({ investments }) {
  if (!investments || investments.length === 0) return null;
  const byCategory = {};
  investments.forEach(h => { byCategory[h.category] = (byCategory[h.category] || 0) + h.value; });
  const total = Object.values(byCategory).reduce((s, v) => s + v, 0) || 1;
  const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const colors = labels.map(l => (INVESTMENT_CATEGORY_META[l] || { color: "#64748b" }).color);

  return (
    <Card className="p-6">
      <h3 className="font-semibold text-slate-700 mb-4">Investment Allocation</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <DoughnutChartCanvas labels={labels} values={values} colors={colors} height={190} />
        <div className="space-y-2">
          {entries.map(([cat, val]) => (
            <div key={cat}>
              <div className="flex items-center justify-between text-xs mb-1">
                <span className="flex items-center gap-1.5 text-slate-600">
                  <span className="w-2 h-2 rounded-full inline-block" style={{ background: (INVESTMENT_CATEGORY_META[cat] || {}).color || "#64748b" }}></span>
                  {cat}
                </span>
                <span className="font-medium text-slate-700">{fmtCurrency(val, { decimals: false })} ({((val / total) * 100).toFixed(0)}%)</span>
              </div>
              <ProgressBar pct={(val / total) * 100} color={(INVESTMENT_CATEGORY_META[cat] || {}).color} />
            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

function DebtPayoffPlanner({ debtAccounts }) {
  const [extra, setExtra] = useState(200);
  const [strategy, setStrategy] = useState("avalanche");

  const payable = debtAccounts.filter(a => a.apr != null);

  const result = useMemo(() => simulatePayoff(payable, extra, strategy), [JSON.stringify(payable), extra, strategy]);
  const payoffDate = useMemo(() => {
    const d = new Date("2026-07-27T00:00:00");
    d.setMonth(d.getMonth() + result.months);
    return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  }, [result.months]);
  const scheduleLabels = result.schedule.map((_, i) => "M" + i);

  if (payable.length === 0) return null;

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 className="font-semibold text-slate-700">Debt Payoff Planner</h3>
        <div className="flex gap-1 bg-slate-100 rounded-lg p-1">
          <button onClick={() => setStrategy("avalanche")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "avalanche" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Avalanche</button>
          <button onClick={() => setStrategy("snowball")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "snowball" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Snowball</button>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <Field label="Extra monthly payment ($)">
            <input type="number" className={inputClass} value={extra} onChange={e => setExtra(Math.max(0, parseFloat(e.target.value) || 0))} />
          </Field>
          <div className="space-y-2 text-sm mt-4">
            <div className="flex justify-between"><span className="text-slate-500">Debt-free by</span><span className="font-semibold text-slate-700">{payoffDate}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Months to pay off</span><span className="font-semibold text-slate-700">{result.months}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Total interest paid</span><span className="font-semibold text-rose-600">{fmtCurrency(result.totalInterest, { decimals: false })}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-100">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Payoff order ({strategy})</div>
            <ol className="text-sm text-slate-600 list-decimal list-inside space-y-1">
              {result.payoffOrder.map((name, i) => <li key={i}>{name}</li>)}
            </ol>
          </div>
        </div>
        <div className="md:col-span-2">
          <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Combined balance over time</div>
          <LineChartCanvas labels={scheduleLabels} values={result.schedule.map(v => Math.round(v))} height={220} />
        </div>
      </div>
    </Card>
  );
}

const AI_GREETING = "Hi! I'm your AI assistant for Michael & Cynthia's Money. Ask me anything about your budget, spending, or accounts — or ask me to scan your transactions for subscriptions you might not be tracking yet.";
const ANTHROPIC_MODELS = [
  { id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 — fast & cheap" },

function buildFinancialContext(data, derived) {
  const lines = [];
  lines.push(`Today's date: July 27, 2026.`);
  lines.push(`Net worth: ${fmtCurrency(derived.netWorth, { decimals: false })} (assets ${fmtCurrency(derived.totalAssets, { decimals: false })}, debt ${fmtCurrency(derived.totalDebt, { decimals: false })}).`);
  lines.push(`Accounts: ${data.accounts.map(a => `${a.name} (${a.institution}, ${a.type}): ${fmtCurrency(a.balance, { decimals: false })}`).join("; ") || "none"}.`);
  lines.push(`This month so far — income: ${fmtCurrency(derived.monthIncome, { decimals: false })}, expenses: ${fmtCurrency(derived.monthExpense, { decimals: false })}, savings rate: ${derived.savingsRate.toFixed(0)}%.`);
  const catLines = Object.entries(derived.spendByCategory).sort((a, b) => b[1] - a[1])
    .map(([cat, spent]) => `${cat}: spent ${fmtCurrency(spent, { decimals: false })}${data.budgets[cat] ? ` of ${fmtCurrency(data.budgets[cat], { decimals: false })} budget` : ""}`);
  lines.push(`Spending by category this month: ${catLines.join("; ") || "none yet"}.`);
  lines.push(`Safe to spend (checking balance minus remaining bills this month): ${fmtCurrency(derived.safeToSpend, { decimals: false })}.`);
  const activeSubs = data.subscriptions.filter(s => s.active);
  lines.push(`Active subscriptions/recurring bills (${activeSubs.length}): ${activeSubs.map(s => `${s.merchant} ${fmtCurrency(s.amount)}/mo (day ${s.dayOfMonth})`).join("; ") || "none"}.`);
  lines.push(`Financial wellness score: ${derived.wellnessScore}/100.`);
  if (data.goals.length > 0) {
    lines.push(`Goals: ${data.goals.map(g => `${g.name}: ${fmtCurrency(g.current, { decimals: false })} of ${fmtCurrency(g.target, { decimals: false })}`).join("; ")}.`);
  }
  const recent = [...data.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 15);
  lines.push(`15 most recent transactions: ${recent.map(t => `${t.date} ${t.merchant} ${fmtCurrency(t.amount)} (${t.category}${t.person ? ", " + t.person : ""})`).join("; ")}.`);
  return lines.join("\n");
}

async function callClaude({ apiKey, model, system, messages }) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model, max_tokens: 1024, system, messages }),
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = (j.error && j.error.message) || JSON.stringify(j); } catch (e) {}
    throw new Error(`Anthropic API error (${res.status}): ${detail || res.statusText}`);
  }
  const json = await res.json();
  const text = (json.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  return text || "(no response)";
}

function isSubscriptionScanIntent(msg) {
  const m = msg.toLowerCase();

function AIAssistant({ data, actions, derived }) {
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(AI_KEY_STORAGE) || ""; } catch (e) { return ""; } });
  const [keyInput, setKeyInput] = useState("");
  const [model, setModel] = useState(() => { try { return localStorage.getItem(AI_MODEL_STORAGE) || ANTHROPIC_MODELS[0].id; } catch (e) { return ANTHROPIC_MODELS[0].id; } });
  const [messages, setMessages] = useState(() => {
    try {
      const raw = localStorage.getItem(AI_CHAT_STORAGE);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {}
    return [{ role: "assistant", content: AI_GREETING }];
  });
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const scrollRef = useRef(null);

  // Persist the conversation (capped) so it survives switching tabs or reloading the page.
  useEffect(() => {
    try { localStorage.setItem(AI_CHAT_STORAGE, JSON.stringify(messages.slice(-60))); } catch (e) {}
  }, [messages]);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, sending]);

  // Candidate status is derived live from real data (not local state) so it stays correct
  // no matter when this component mounts/unmounts, and across restored chat history.
  const candidateStatusFor = (c) => {
    const norm = normalizeMerchantName(c.merchant);
    const isAdded = data.subscriptions.some(s => {
      const sn = normalizeMerchantName(s.merchant);
      return sn && (sn.includes(norm) || norm.includes(sn));
    });
    if (isAdded) return "added";
    if ((data.dismissedSubscriptionCandidates || []).includes(c.id)) return "ignored";
    return null;
  };

  const clearChat = () => {
    if (!window.confirm("Clear this conversation?")) return;
    setMessages([{ role: "assistant", content: AI_GREETING }]);
  };

  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    try { localStorage.setItem(AI_KEY_STORAGE, k); } catch (e) {}
    setApiKey(k);
    setKeyInput("");
  };
  const clearKey = () => {
    if (!window.confirm("Remove your saved API key from this browser?")) return;
    try { localStorage.removeItem(AI_KEY_STORAGE); } catch (e) {}
    setApiKey("");
  };
  const changeModel = (id) => {
    setModel(id);
    try { localStorage.setItem(AI_MODEL_STORAGE, id); } catch (e) {}
  };

  const runSubscriptionScan = () => {
    const dismissed = data.dismissedSubscriptionCandidates || [];
    const all = detectUnknownSubscriptions(data);
    const candidates = all.filter(c => !dismissed.includes(c.id));
    const alreadyDismissedCount = all.length - candidates.length;
    let text;
    if (candidates.length === 0) {
      text = alreadyDismissedCount > 0
        ? "I scanned your transactions and didn't find any new recurring charges — everything that looked like a subscription is already tracked or was previously ignored."
        : "I scanned your transactions and didn't find any recurring, fixed-amount charges that aren't already tracked as subscriptions.";
    } else {
      text = `I scanned your transactions and found ${candidates.length} recurring charge${candidates.length > 1 ? "s" : ""} that ${candidates.length > 1 ? "aren't" : "isn't"} tracked as a subscription yet — want me to add ${candidates.length > 1 ? "any of these" : "it"}?`;
    }
    setMessages(m => [...m, { role: "assistant", content: text, candidates: candidates.length > 0 ? candidates : undefined }]);
  };

  const send = async () => {
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setError("");
    const nextMessages = [...messages, { role: "user", content: text }];
    setMessages(nextMessages);

    if (isSubscriptionScanIntent(text)) {
      runSubscriptionScan();
      return;
    }

    if (!apiKey) {
      setMessages(m => [...m, { role: "assistant", content: "Add your Anthropic API key above to chat with me about open-ended questions — or ask me to \"scan for subscriptions,\" which works without a key." }]);
      return;
    }

    setSending(true);
    try {
      const system = "You are a helpful, concise personal finance assistant embedded in a couple's budgeting app called \"Michael & Cynthia's Money.\" Answer questions using the financial data below. Be specific and use real numbers from the data. Keep answers brief and conversational unless asked for detail.\n\n" + buildFinancialContext(data, derived);
      const history = nextMessages
        .filter(m => !m.candidates)
        .slice(-20)
        .map(m => ({ role: m.role, content: m.content }));
      const reply = await callClaude({ apiKey, model, system, messages: history });
      setMessages(m => [...m, { role: "assistant", content: reply }]);
    } catch (e) {
      setError(e.message || "Something went wrong talking to the AI.");
    } finally {
      setSending(false);
    }
  };

  const addCandidate = (c) => {
    actions.addSubscription({
      id: uid(), merchant: c.merchant, category: c.category, amount: c.amount, cadence: "Monthly",
      dayOfMonth: c.dayOfMonth, active: true, priceHistory: [{ date: c.lastDate, amount: c.amount }], person: c.person,
    });
  };
  const ignoreCandidate = (c) => {
    actions.dismissSubscriptionCandidate(c.id);
  };

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">AI Assistant</h1>
        <p className="text-slate-500 text-sm mt-1">Ask questions about your finances, or have it scan for untracked subscriptions.</p>
      </div>

      <SectionNotes section="ai" data={data} actions={actions} />

      <Card className="p-4">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="text-sm">
            <span className="font-medium text-slate-700">Anthropic API key: </span>
            {apiKey ? (
              <span className="text-emerald-600 font-medium">Connected ({apiKey.slice(0, 8)}…)</span>
            ) : (
              <span className="text-slate-400">Not set — open-ended chat is unavailable until you add one</span>
            )}
          </div>
          {apiKey && (
            <div className="flex items-center gap-2">
              <select className={inputClass + " max-w-[260px]"} value={model} onChange={e => changeModel(e.target.value)}>
                {ANTHROPIC_MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
              <button className="text-xs text-rose-500 font-medium" onClick={clearKey}>Remove key</button>
            </div>
          )}
        </div>
        {!apiKey && (
          <div className="mt-3 flex flex-wrap gap-2 items-center">
            <input
              type="password" placeholder="sk-ant-..." className={inputClass + " max-w-xs"}
              value={keyInput} onChange={e => setKeyInput(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") saveKey(); }}
            />
            <Button className="text-xs px-3 py-2" onClick={saveKey}>Save Key</Button>
          </div>
        )}
        <p className="text-xs text-slate-400 mt-2">
          Your key is stored only in this browser's local storage and sent directly from your browser to Anthropic's API when you chat — it never passes through any server of ours. Don't use this on a shared or public computer. Get a key at{" "}
          <span className="text-indigo-500">console.anthropic.com</span>.
        </p>
      </Card>

      <Card className="overflow-hidden flex flex-col" style={{ height: "60vh", minHeight: 420 }}>
        <div className="flex items-center justify-end px-4 pt-3">
          <button type="button" className="text-xs text-slate-400 hover:text-rose-500 font-medium" onClick={clearChat}>Clear chat</button>
        </div>
        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 md:p-5 space-y-4">
          {messages.map((m, i) => (
            <div key={i} className={"flex " + (m.role === "user" ? "justify-end" : "justify-start")}>
              <div className={"max-w-[85%] space-y-2"}>
                <div className={"rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap " + (m.role === "user" ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700")}>
                  {m.content}
                </div>
                {m.candidates && (
                  <div className="space-y-2">
                    {m.candidates.map(c => (
                      <SubscriptionCandidateCard
                        key={c.id} candidate={c} status={candidateStatusFor(c)}
                        onAdd={() => addCandidate(c)} onIgnore={() => ignoreCandidate(c)}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}
          {sending && (
            <div className="flex justify-start">
              <div className="rounded-2xl px-4 py-2.5 text-sm bg-slate-100 text-slate-400">Thinking…</div>
            </div>
          )}
          {error && (
            <div className="flex justify-start">
              <div className="rounded-2xl px-4 py-2.5 text-sm bg-rose-50 text-rose-600 border border-rose-200">{error}</div>
            </div>
          )}
        </div>
        <div className="border-t border-slate-100 p-3 flex gap-2 items-center flex-wrap">
          <Button variant="secondary" className="text-xs px-3 py-2" onClick={runSubscriptionScan}>🔍 Scan for Subscriptions</Button>
          <input
            className={inputClass + " flex-1 min-w-[160px]"} placeholder="Ask about your budget, spending, accounts…"
            value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") send(); }}
          />
          <Button className="text-xs px-4 py-2" onClick={send} disabled={sending}>Send</Button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== SETTINGS (BACKUP & RESTORE) ============================== */

const LAST_BACKUP_STORAGE = "meridian_money_last_backup";

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function isPlausibleBackup(obj) {
  const d = obj && obj.data ? obj.data : obj;
  return !!d && Array.isArray(d.accounts) && Array.isArray(d.transactions);
}

function Settings({ data, actions }) {
  const [restoreError, setRestoreError] = useState("");
  const [restoreSuccess, setRestoreSuccess] = useState("");
  const [lastBackup, setLastBackup] = useState(() => { try { return localStorage.getItem(LAST_BACKUP_STORAGE) || ""; } catch (e) { return ""; } });
  const [clearConfirmText, setClearConfirmText] = useState("");
  const fileInputRef = useRef(null);

  const handleBackup = () => {
    const envelope = { app: "Michael & Cynthia's Money", version: 1, exportedAt: new Date().toISOString(), data };
    const stamp = new Date().toISOString().slice(0, 10);
    downloadJSON(envelope, `michael-cynthia-money-backup-${stamp}.json`);
    try { localStorage.setItem(LAST_BACKUP_STORAGE, new Date().toISOString()); } catch (e) {}
    setLastBackup(new Date().toISOString());
  };

  const openFilePicker = () => { setRestoreError(""); setRestoreSuccess(""); fileInputRef.current && fileInputRef.current.click(); };

  const handleFile = (file) => {
    if (!file) return;
    setRestoreError(""); setRestoreSuccess("");
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { setRestoreError("That file isn't valid JSON — make sure you're selecting a backup exported from this app."); return; }
      if (!isPlausibleBackup(parsed)) { setRestoreError("That file doesn't look like a Michael & Cynthia's Money backup (missing accounts/transactions)."); return; }
      const restored = parsed.data ? parsed.data : parsed;
      const exportedAt = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : "an unknown date";
      if (!window.confirm(`Restore this backup from ${exportedAt}? This will replace everything currently in the app — all accounts, transactions, budgets, goals, and subscriptions. This can't be undone.`)) return;
      actions.restoreData(restored);
      setRestoreSuccess(`Restored backup from ${exportedAt}.`);
    };
    reader.onerror = () => setRestoreError("Couldn't read that file.");
    reader.readAsText(file);
  };

  const resetDemo = () => {
    if (window.confirm("Clear the sample demo data (fictional accounts, transactions, budgets, goals, subscriptions)? Your real imported registers — Cindy's Credit Card, Cindy's Checking, Mike's Checking, Savings, and HYSA — will be kept, reset to their originally imported state. This can't be undone.")) actions.resetDemo();
  };

  const clearEverything = () => {
    if (clearConfirmText.trim().toUpperCase() !== "DELETE") return;
    if (!window.confirm("This will permanently erase EVERYTHING in this app — including your real accounts, transactions, budgets, goals, and subscriptions, not just the demo data. There is no undo unless you've downloaded a backup. Are you absolutely sure?")) return;
    actions.clearAllData();
    setClearConfirmText("");
  };

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Settings</h1>
        <p className="text-slate-500 text-sm mt-1">Back up your data, restore a previous backup, or reset the sample data.</p>
      </div>

      <SectionNotes section="settings" data={data} actions={actions} />

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">💾 Backup</h3>
        <p className="text-sm text-slate-500 mt-1">Download everything in this app — accounts, transactions, budgets, goals, subscriptions, and notes — as a JSON file you can keep somewhere safe.</p>
        <div className="flex items-center gap-3 mt-3 flex-wrap">
          <Button onClick={handleBackup}>⬇ Download Backup</Button>
          {lastBackup && <span className="text-xs text-slate-400">Last backup: {new Date(lastBackup).toLocaleString()}</span>}
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">📤 Restore</h3>
        <p className="text-sm text-slate-500 mt-1">Choose a backup file you've previously downloaded to restore it. This replaces all current data in the app, so make sure you've backed up anything you want to keep first.</p>
        <div className="flex items-center gap-3 mt-3 flex-wrap">
          <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden" onChange={e => handleFile(e.target.files[0])} />
          <Button variant="secondary" onClick={openFilePicker}>📤 Choose Backup File…</Button>
        </div>
        {restoreError && <p className="text-sm text-rose-600 mt-2">{restoreError}</p>}
        {restoreSuccess && <p className="text-sm text-emerald-600 mt-2">{restoreSuccess}</p>}
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">⚠️ Reset Demo Data</h3>
        <p className="text-sm text-slate-500 mt-1">Clear the fictional Michael &amp; Cynthia sample data. Your real imported registers (Cindy's Credit Card, Cindy's Checking, Mike's Checking, Savings, and HYSA) are kept, reset to their originally imported state.</p>
        <div className="mt-3">
          <Button variant="secondary" onClick={resetDemo}>Reset Demo Data</Button>
        </div>
      </Card>

      <Card className="p-5 border-2 border-rose-200">
        <h3 className="font-semibold text-rose-700">🗑️ Clear All Data</h3>
        <p className="text-sm text-slate-500 mt-1">
          Permanently erase <span className="font-semibold text-rose-600">everything</span> in this app — including your real accounts, transactions, budgets, goals, subscriptions, rules, and notes, not just the demo data. This can't be undone, so download a backup first if you might want any of it later.
        </p>
        <div className="mt-3 flex flex-wrap items-center gap-3">
          <input
            placeholder='Type DELETE to confirm'
            className={inputClass + " max-w-[200px]"}
            value={clearConfirmText}
            onChange={e => setClearConfirmText(e.target.value)}
          />
          <Button variant="danger" onClick={clearEverything} disabled={clearConfirmText.trim().toUpperCase() !== "DELETE"}>Clear All Data</Button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== APP ROOT ============================== */

const TAB_LABELS = {
  dashboard: "Dashboard", budgets: "Budgets", transactions: "Transactions",
  subscriptions: "Subscriptions & Bills", cashflow: "Cash Flow", goals: "Goals", accounts: "Accounts",
  ai: "AI Assistant", settings: "Settings",
};

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState(() => {
    try {
      const saved = localStorage.getItem(ACTIVE_TAB_KEY);
      return VALID_TABS.includes(saved) ? saved : "dashboard";
    } catch (e) { return "dashboard"; }
  });
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  useEffect(() => { saveData(data); }, [data]);
  useEffect(() => { try { localStorage.setItem(ACTIVE_TAB_KEY, tab); } catch (e) {} }, [tab]);

  const derived = useDerived(data);

  const actions = {
    addTransaction: (t) => setData(d => ({ ...d, transactions: [t, ...d.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)) })),
    updateTransaction: (t) => setData(d => ({ ...d, transactions: d.transactions.map(x => x.id === t.id ? t : x) })),
    deleteTransaction: (id) => setData(d => ({ ...d, transactions: d.transactions.filter(x => x.id !== id) })),
    reassignTransactionsAccount: (ids, accountId) => setData(d => {
      const idSet = new Set(ids);
      return { ...d, transactions: d.transactions.map(t => idSet.has(t.id) ? { ...t, accountId } : t) };
    }),
    importTransactions: (arr) => setData(d => ({ ...d, transactions: [...arr, ...d.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)) })),

    toggleBillPaid: (monthKey, id) => setData(d => {
      const paidBills = { ...(d.paidBills || {}) };
      const monthMap = { ...(paidBills[monthKey] || {}) };
      monthMap[id] = !monthMap[id];
      paidBills[monthKey] = monthMap;
      return { ...d, paidBills };
    }),

    setBudget: (cat, val) => setData(d => ({ ...d, budgets: { ...d.budgets, [cat]: val } })),

    toggleSubscription: (id) => setData(d => ({ ...d, subscriptions: d.subscriptions.map(s => s.id === id ? { ...s, active: !s.active } : s) })),
    addSubscription: (s) => setData(d => ({ ...d, subscriptions: [...d.subscriptions, s] })),
    updateSubscription: (s) => setData(d => ({ ...d, subscriptions: d.subscriptions.map(x => x.id === s.id ? s : x) })),
    deleteSubscription: (id) => setData(d => ({ ...d, subscriptions: d.subscriptions.filter(x => x.id !== id) })),
    dismissSubscriptionCandidate: (id) => setData(d => ({ ...d, dismissedSubscriptionCandidates: [...(d.dismissedSubscriptionCandidates || []), id] })),

    addGoal: (g) => setData(d => ({ ...d, goals: [...d.goals, g] })),
    updateGoal: (g) => setData(d => ({ ...d, goals: d.goals.map(x => x.id === g.id ? g : x) })),
    deleteGoal: (id) => setData(d => ({ ...d, goals: d.goals.filter(x => x.id !== id) })),
    contributeToGoal: (id, amt) => setData(d => ({ ...d, goals: d.goals.map(g => g.id === id ? { ...g, current: Math.max(0, g.current + amt) } : g) })),

    addAccount: (a) => setData(d => ({ ...d, accounts: [...d.accounts, a] })),
    updateAccount: (a) => setData(d => ({ ...d, accounts: d.accounts.map(x => x.id === a.id ? a : x) })),
    deleteAccount: (id) => setData(d => ({ ...d, accounts: d.accounts.filter(x => x.id !== id) })),

    addRule: (r) => setData(d => ({ ...d, rules: [...(d.rules || []), r] })),
    deleteRule: (id) => setData(d => ({ ...d, rules: (d.rules || []).filter(r => r.id !== id) })),
    applyRules: () => setData(d => ({
      ...d,
      transactions: d.transactions.map(t => {
        const match = (d.rules || []).find(r => t.merchant.toLowerCase().includes(r.keyword.toLowerCase()));
        return match ? { ...t, category: match.category } : t;
      }),
    })),

    resetDemo: () => { setData(ensureUserNamedSubscriptions(ensureDiscoverRegister(ensureHouseholdRegisters(ensureCindyRegister(emptyData()))))); },
    restoreData: (newData) => { setData(ensureUserNamedSubscriptions(ensureDiscoverRegister(ensureHouseholdRegisters(ensureCindyRegister(newData))))); },
    // Unlike resetDemo, this does NOT re-apply the real-register migrations — it's a genuinely blank slate,
    // wiping the user's real imported data along with the demo content.
    clearAllData: () => { setData(emptyData()); },

    addCategory: (name) => setData(d => {
      const trimmed = String(name || "").trim();
      if (!trimmed) return d;
      const existing = new Set([...EXPENSE_CATEGORIES, ...(d.customCategories || [])].map(c => c.toLowerCase()));
      if (existing.has(trimmed.toLowerCase())) return d;
      return { ...d, customCategories: [...(d.customCategories || []), trimmed] };
    }),

    setCindyNotes: (text) => setData(d => ({ ...d, cindyRegisterNotes: text })),
    setRegisterNotes: (accountId, text) => setData(d => ({ ...d, registerNotes: { ...(d.registerNotes || {}), [accountId]: text } })),
    setSectionNotes: (section, text) => setData(d => ({ ...d, sectionNotes: { ...(d.sectionNotes || {}), [section]: text } })),
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar tab={tab} setTab={setTab} netWorth={derived.netWorth} mobileOpen={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} sectionNotes={data.sectionNotes} />
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div className="md:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-200 shrink-0">
          <button onClick={() => setMobileMenuOpen(true)} className="text-slate-600 text-2xl leading-none px-1" aria-label="Open menu">☰</button>
          <div className="font-semibold text-slate-800 truncate">{TAB_LABELS[tab] || "Menu"}</div>
        </div>
        <main className="flex-1 overflow-y-auto">
          {tab === "dashboard" && <Dashboard data={data} derived={derived} actions={actions} />}
          {tab === "budgets" && <Budgets data={data} actions={actions} derived={derived} />}
          {tab === "transactions" && <Transactions data={data} actions={actions} />}
          {tab === "subscriptions" && <Subscriptions data={data} actions={actions} />}
          {tab === "cashflow" && <CashFlow data={data} derived={derived} actions={actions} />}
          {tab === "goals" && <Goals data={data} actions={actions} />}
          {tab === "accounts" && <Accounts data={data} actions={actions} derived={derived} />}
          {tab === "ai" && <AIAssistant data={data} actions={actions} derived={derived} />}
          {tab === "settings" && <Settings data={data} actions={actions} />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
