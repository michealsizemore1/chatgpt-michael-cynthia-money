function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const s = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQuotes) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => String(cell).trim() !== ""));
}

const IMPORT_COLUMN_ALIASES = {
  date: ["date", "transaction date", "posted date", "post date", "trans date", "effective date"],

function guessColumnMapping(headers) {
  const mapping = { date: null, description: null, amount: null, debit: null, credit: null, category: null };
  const used = new Set();
  Object.keys(IMPORT_COLUMN_ALIASES).forEach(field => {
    const aliases = IMPORT_COLUMN_ALIASES[field];
    let foundIdx = -1;
    headers.forEach((h, idx) => {
      if (used.has(idx) || foundIdx !== -1) return;
      const hLower = String(h || "").trim().toLowerCase();
      if (aliases.some(a => hLower === a || hLower.includes(a))) foundIdx = idx;
    });
    if (foundIdx !== -1) { mapping[field] = foundIdx; used.add(foundIdx); }
  });
  return mapping;
}

function parseAmountCell(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,]/g, "").trim();
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  else if (s.startsWith("+")) { s = s.slice(1); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

function parseDateCell(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, mm, dd, yy] = m;
    if (yy.length === 2) yy = (parseInt(yy, 10) < 70 ? "20" : "19") + yy;
    const mi = parseInt(mm, 10), di = parseInt(dd, 10);
    if (mi >= 1 && mi <= 12 && di >= 1 && di <= 31) return `${yy}-${pad(mi)}-${pad(di)}`;
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return "";
}

function guessCategoryFromRules(merchant, rules, amount) {

function isDuplicateTx(candidate, existingTx, accountId) {
  return existingTx.some(t =>
    t.accountId === accountId &&
    t.date === candidate.date &&
    Math.abs(t.amount - candidate.amount) < 0.005 &&
    t.merchant.trim().toLowerCase() === candidate.merchant.trim().toLowerCase()
  );
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fileToCompressedDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function estimateMinPayment(account) {
  if (account.type === "credit") return Math.max(35, Math.abs(account.balance) * 0.03);
  if (account.type === "loan") return 310;
  return 0;
}

function simulatePayoff(debtAccounts, extraMonthly, strategy) {
  let bals = debtAccounts.map(d => ({ id: d.id, name: d.name, balance: Math.abs(d.balance), apr: d.apr || 0, minPayment: estimateMinPayment(d) }));
  const order = strategy === "avalanche"
    ? [...bals].sort((a, b) => b.apr - a.apr).map(d => d.id)
    : [...bals].sort((a, b) => a.balance - b.balance).map(d => d.id);

  let months = 0, totalInterest = 0;
  const schedule = [bals.reduce((s, d) => s + d.balance, 0)];
  while (bals.some(d => d.balance > 0.01) && months < 480) {
    months++;
    bals.forEach(d => {
      if (d.balance <= 0) return;
      const interest = d.balance * (d.apr / 100 / 12);
      totalInterest += interest;
      d.balance += interest;
    });
    bals.forEach(d => {
      if (d.balance <= 0) return;
      d.balance -= Math.min(d.minPayment, d.balance);
    });
    let extra = extraMonthly;
    for (const id of order) {
      if (extra <= 0) break;
      const d = bals.find(x => x.id === id);
      if (!d || d.balance <= 0) continue;
      const pay = Math.min(extra, d.balance);
      d.balance -= pay;
      extra -= pay;
    }
    schedule.push(bals.reduce((s, d) => s + Math.max(0, d.balance), 0));
  }
  return { months, totalInterest, schedule, payoffOrder: order.map(id => bals.find(d => d.id === id).name) };
}

function buildInsights(data, derived) {
  const insights = [];
  const months = derived.trendMonths;

  if (months.length >= 2) {
    const cur = months[months.length - 1];
    const prev = months[months.length - 2];
    const curTotals = derived.monthlyCategoryTotals[cur] || {};
    const prevTotals = derived.monthlyCategoryTotals[prev] || {};
    let biggest = null;
    Object.keys(curTotals).forEach(cat => {
      const prevAmt = prevTotals[cat] || 0;
      const curAmt = curTotals[cat];
      if (prevAmt > 20) {
        const pctChange = ((curAmt - prevAmt) / prevAmt) * 100;
        if (!biggest || Math.abs(pctChange) > Math.abs(biggest.pctChange)) biggest = { cat, pctChange, curAmt, prevAmt };
      }
    });
    if (biggest && Math.abs(biggest.pctChange) >= 10) {
      insights.push({
        icon: biggest.pctChange > 0 ? "📈" : "📉",
        text: `${biggest.cat} spending is ${biggest.pctChange > 0 ? "up" : "down"} ${Math.abs(biggest.pctChange).toFixed(0)}% vs last month (${fmtCurrency(biggest.curAmt, { decimals: false })} vs ${fmtCurrency(biggest.prevAmt, { decimals: false })}).`,
      });
    }
  }

  if (derived.budgetAlerts.length > 0) {
    const worst = [...derived.budgetAlerts].sort((a, b) => b.pct - a.pct)[0];
    const daysLeft = daysInMonth(2026, 7) - 27;
    insights.push({ icon: "⚠️", text: `${worst.cat} is ${worst.over ? "over budget" : `at ${worst.pct.toFixed(0)}% of budget`} with ${daysLeft} days left in the month.` });
  }

  data.goals.forEach(g => {
    const pct = g.target > 0 ? (g.current / g.target) * 100 : 0;
    if (pct >= 90 && pct < 100) insights.push({ icon: "🏆", text: `You're ${pct.toFixed(0)}% of the way to "${g.name}" — almost there!` });
  });

  const cancelledSubs = (data.subscriptions || []).filter(s => !s.active);
  if (cancelledSubs.length > 0) {
    const saved = cancelledSubs.reduce((s, x) => s + x.amount, 0);
    insights.push({ icon: "💸", text: `Cancelling ${cancelledSubs.length} subscription${cancelledSubs.length > 1 ? "s" : ""} is saving you ${fmtCurrency(saved, { decimals: false })}/mo (${fmtCurrency(saved * 12, { decimals: false })}/yr).` });
  }

  if (derived.savingsRate >= 20) {
    insights.push({ icon: "🎉", text: `Nice work — you're saving ${derived.savingsRate.toFixed(0)}% of income this month, above the 20% benchmark.` });
  } else if (derived.savingsRate < 5 && derived.monthIncome > 0) {
    insights.push({ icon: "🔍", text: `Savings rate is ${derived.savingsRate.toFixed(0)}% this month — below the 20% benchmark most planners recommend.` });
  }

  return insights.slice(0, 5);
}

/* ---- Recurring-charge / unknown-subscription detector -----------------
   Groups expense transactions by merchant, then flags groups that recur
   across at least 2 different months at a fairly consistent dollar amount
   (the signature of a subscription or fixed bill) and aren't already
   tracked in data.subscriptions. Deliberately ignores day-to-day spending
   like coffee or groceries, where the amount varies trip to trip. */
function normalizeMerchantName(name) {
  return (name || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function detectUnknownSubscriptions(data) {
  const known = (data.subscriptions || []).map(s => normalizeMerchantName(s.merchant));
  const isKnown = (norm) => known.some(k => k && (norm.includes(k) || k.includes(norm)));

  const groups = {};
  (data.transactions || []).forEach(t => {
    if (t.amount >= 0) return; // only charges/expenses
    if (t.category === "Transfer" || t.category === "Income") return;
    const norm = normalizeMerchantName(t.merchant);
    if (!norm) return;
    if (isKnown(norm)) return;
    groups[norm] = groups[norm] || { merchant: t.merchant, category: t.category, txns: [] };
    groups[norm].txns.push(t);
  });

  const candidates = [];
  Object.values(groups).forEach(g => {
    if (g.txns.length < 2) return;
    const months = new Set(g.txns.map(t => monthKey(t.date)));
    if (months.size < 2) return; // must recur across at least 2 different months

    const amounts = g.txns.map(t => Math.abs(t.amount));
    const avg = amounts.reduce((s, a) => s + a, 0) / amounts.length;
    const maxDiff = Math.max(...amounts.map(a => Math.abs(a - avg)));
    const consistent = maxDiff <= Math.max(1.5, avg * 0.08); // within 8% or $1.50, whichever is larger
    if (!consistent) return;

    // Require a roughly monthly cadence (20-45 days between charges on average) so we don't
    // flag coincidentally-similar one-off purchases (e.g. two unrelated Sephora trips).
    const sorted = [...g.txns].sort((a, b) => (a.date < b.date ? -1 : 1));
    const firstDate = new Date(sorted[0].date + "T00:00:00");
    const lastDateObj = new Date(sorted[sorted.length - 1].date + "T00:00:00");
    const spanDays = (lastDateObj - firstDate) / 86400000;
    const avgGapDays = spanDays / (sorted.length - 1);
    if (avgGapDays < 20 || avgGapDays > 45) return;

    const desc = [...g.txns].sort((a, b) => (a.date < b.date ? 1 : -1));
    const dayOfMonth = new Date(desc[0].date + "T00:00:00").getDate();

    candidates.push({
      id: "cand_" + normalizeMerchantName(g.merchant).replace(/\s+/g, "_"),
      merchant: g.merchant,
      category: g.category,
      amount: Math.round(avg * 100) / 100,
      dayOfMonth,
      occurrences: g.txns.length,
      months: months.size,
      lastDate: desc[0].date,
      person: desc[0].person || "Joint",
    });
  });

  return candidates.sort((a, b) => b.occurrences - a.occurrences);
}

  const merchantPools = {
    "Groceries":        { m: ["Whole Foods Market", "Trader Joe's", "Safeway", "Kroger", "Costco Wholesale"], min: 28, max: 145 },
    "Dining & Coffee":   { m: ["Starbucks", "Chipotle", "Local Coffee Co.", "Sushi House", "Pizza Palace", "DoorDash", "Panera Bread"], min: 6, max: 68 },
    "Transportation":   { m: ["Shell Gas Station", "Chevron", "Uber", "Lyft", "City Metro Transit"], min: 11, max: 62 },
    "Shopping":         { m: ["Amazon", "Target", "Best Buy", "Nike", "Home Depot", "Etsy"], min: 14, max: 225 },
    "Entertainment":    { m: ["AMC Theatres", "Steam", "Ticketmaster", "Lucky Strike Bowling"], min: 9, max: 92 },
    "Personal Care":    { m: ["Great Clips", "Sephora", "CVS Pharmacy"], min: 14, max: 88 },
    "Other":            { m: ["Venmo Transfer", "ATM Withdrawal", "USPS", "Misc Purchase"], min: 8, max: 60 },
  };

  const freqDays = { "Groceries": 4, "Dining & Coffee": 2, "Transportation": 5, "Shopping": 6, "Entertainment": 9, "Personal Care": 19, "Other": 14 };

  const personWeights = {
    "Groceries":       { Joint: 0.8, Michael: 0.1, Cynthia: 0.1 },
    "Dining & Coffee": { Joint: 0.34, Michael: 0.33, Cynthia: 0.33 },
    "Transportation":  { Joint: 0.1, Michael: 0.5, Cynthia: 0.4 },
    "Shopping":        { Joint: 0.2, Michael: 0.35, Cynthia: 0.45 },
    "Entertainment":   { Joint: 0.6, Michael: 0.2, Cynthia: 0.2 },
    "Personal Care":   { Joint: 0, Michael: 0.4, Cynthia: 0.6 },
    "Other":           { Joint: 0.7, Michael: 0.15, Cynthia: 0.15 },
  };
  const weightedPerson = (weights) => {
    const r = rng(); let acc = 0;
    for (const [k, w] of Object.entries(weights)) { acc += w; if (r < acc) return k; }
    return "Joint";
  };

  const transactions = [];
  const start = new Date("2026-04-01T00:00:00");
  const end = new Date("2026-07-27T00:00:00");

  // Variable day-to-day spending
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const iso = d.toISOString().slice(0, 10);
    Object.keys(freqDays).forEach((cat) => {
      if (rng() < 1 / freqDays[cat]) {
        const pool = merchantPools[cat];
        const amt = -range(pool.min, pool.max);
        transactions.push({
          id: uid(), date: iso, accountId: rng() < 0.55 ? "acc_credit" : "acc_checking",
          merchant: pick(pool.m), category: cat, amount: amt, notes: "", person: weightedPerson(personWeights[cat]),
        });
      }
    });
  }

  // Fixed monthly bills + subscriptions across each month in range
  const months = [];
  for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d.setMonth(d.getMonth() + 1)) {
    months.push({ y: d.getFullYear(), m: d.getMonth() + 1 });
  }

  const fixedBills = [
    { merchant: "Skyline Apartments", category: "Housing", amount: 1800, day: 1, accountId: "acc_checking", person: "Joint" },
    { merchant: "Pacific Gas & Electric", category: "Utilities", amount: null, min: 84, max: 138, day: 10, accountId: "acc_checking", person: "Joint" },
    { merchant: "Xfinity Internet", category: "Utilities", amount: 70.00, day: 14, accountId: "acc_checking", person: "Joint" },
    { merchant: "Toyota Financial Services", category: "Transportation", amount: 310.00, day: 5, accountId: "acc_checking", person: "Michael" },
    { merchant: "Planet Fitness", category: "Health & Fitness", amount: 24.99, day: 1, accountId: "acc_checking", person: "Cynthia" },
  ];

  months.forEach(({ y, m }) => {
    fixedBills.forEach((b) => {
      const day = Math.min(b.day, daysInMonth(y, m));
      const iso = isoDate(y, m, day);
      if (new Date(iso) > end) return;
      const amt = b.amount != null ? b.amount : range(b.min, b.max);
      transactions.push({ id: uid(), date: iso, accountId: b.accountId, merchant: b.merchant, category: b.category, amount: -amt, notes: "", person: b.person });
    });
  });

  const recurringBills = fixedBills.map((b) => ({
    id: uid(), merchant: b.merchant, category: b.category,
    amount: b.amount != null ? b.amount : Math.round((b.min + b.max) / 2 * 100) / 100,
    dayOfMonth: b.day, person: b.person, variable: b.amount == null,
  }));

  // Subscriptions (tracked separately too)
  const subDefs = [
    { merchant: "Netflix", category: "Subscriptions", day: 5, accountId: "acc_credit", person: "Joint", history: [{ date: "2026-01-05", amount: 15.49 }] },
    { merchant: "Spotify", category: "Subscriptions", day: 8, accountId: "acc_credit", person: "Michael", history: [{ date: "2026-02-08", amount: 10.99 }, { date: "2026-05-08", amount: 11.99 }] },
    { merchant: "Disney+", category: "Subscriptions", day: 12, accountId: "acc_credit", person: "Joint", history: [{ date: "2026-01-12", amount: 13.99 }] },
    { merchant: "iCloud+ 200GB", category: "Subscriptions", day: 2, accountId: "acc_credit", person: "Michael", history: [{ date: "2026-01-02", amount: 2.99 }] },
    { merchant: "Amazon Prime", category: "Subscriptions", day: 20, accountId: "acc_credit", person: "Joint", history: [{ date: "2026-01-20", amount: 14.99 }] },
    { merchant: "The New York Times", category: "Subscriptions", day: 15, accountId: "acc_credit", person: "Cynthia", history: [{ date: "2026-03-15", amount: 17.00 }] },
  ];

  months.forEach(({ y, m }) => {
    subDefs.forEach((s) => {
      const day = Math.min(s.day, daysInMonth(y, m));
      const iso = isoDate(y, m, day);
      if (new Date(iso) > end) return;
      let amt = s.history[0].amount;
      for (const h of s.history) if (iso >= h.date) amt = h.amount;
      transactions.push({ id: uid(), date: iso, accountId: s.accountId, merchant: s.merchant, category: s.category, amount: -amt, notes: "", person: s.person });
    });
  });

  const subscriptions = subDefs.map((s) => ({
    id: uid(), merchant: s.merchant, category: s.category, cadence: "Monthly",
    amount: s.history[s.history.length - 1].amount, dayOfMonth: s.day, active: true, priceHistory: s.history, person: s.person,
  }));

  // Biweekly paychecks — Michael and Cynthia each have their own income stream
  let payDateM = new Date("2026-04-03T00:00:00");
  while (payDateM <= end) {
    transactions.push({
      id: uid(), date: payDateM.toISOString().slice(0, 10), accountId: "acc_checking",
      merchant: "Acme Corp Payroll", category: "Income", amount: 2850.00, notes: "Biweekly paycheck", person: "Michael",
    });
    payDateM = new Date(payDateM.getTime() + 14 * 86400000);
  }
  let payDateC = new Date("2026-04-10T00:00:00");
  while (payDateC <= end) {
    transactions.push({
      id: uid(), date: payDateC.toISOString().slice(0, 10), accountId: "acc_checking",
      merchant: "BrightPath Consulting", category: "Income", amount: 2200.00, notes: "Biweekly paycheck", person: "Cynthia",
    });
    payDateC = new Date(payDateC.getTime() + 14 * 86400000);
  }

  // Occasional transfer to savings
  ["2026-04-15", "2026-05-15", "2026-06-15", "2026-07-15"].forEach((iso) => {
    if (new Date(iso) <= end) {
      transactions.push({ id: uid(), date: iso, accountId: "acc_checking", merchant: "Transfer to Savings", category: "Transfer", amount: -500, notes: "", person: "Joint" });
      transactions.push({ id: uid(), date: iso, accountId: "acc_savings", merchant: "Transfer from Checking", category: "Transfer", amount: 500, notes: "", person: "Joint" });
    }
  });

  const rules = [
    { id: uid(), keyword: "Starbucks", category: "Dining & Coffee" },
    { id: uid(), keyword: "Whole Foods", category: "Groceries" },
    { id: uid(), keyword: "Amazon", category: "Shopping" },
    { id: uid(), keyword: "Shell", category: "Transportation" },
  ];

  transactions.sort((a, b) => (a.date < b.date ? 1 : -1));

  const netWorthHistory = [
    { month: "2026-01", netWorth: 28950 },
    { month: "2026-02", netWorth: 29680 },
    { month: "2026-03", netWorth: 30420 },

    { month: "2026-06", netWorth: 33240 },
    { month: "2026-07", netWorth: accounts.filter(a => a.type !== "checking").reduce((s, a) => s + a.balance, 0) },
  ];

  const goals = [
    { id: uid(), name: "Emergency Fund", icon: "🛟", target: 15000, current: 9200, deadline: "2026-12-31", color: "#4f46e5" },
    { id: uid(), name: "Hawaii Trip", icon: "🌺", target: 4000, current: 1450, deadline: "2027-03-01", color: "#0ea5e9" },
    { id: uid(), name: "New Car Down Payment", icon: "🚗", target: 6000, current: 2100, deadline: "2027-06-01", color: "#f59e0b" },
    { id: uid(), name: "Pay Off Credit Card", icon: "💳", target: 1284, current: 380, deadline: "2026-11-01", color: "#ec4899" },
  ];

  return { accounts, transactions, budgets: { ...DEFAULT_BUDGETS }, subscriptions, goals, netWorthHistory, recurringBills, rules, investments, paidBills: {}, customCategories: [] };
}

function ensureCindyRegister(data) {

  let transactions = data.transactions || [];

  const hasAccount = accounts.some(a => a.id === CINDY_CC_ACCOUNT_ID || a.name === CINDY_CC_ACCOUNT_NAME);
  const hasRealImport = transactions.some(t => t.notes === CINDY_IMPORT_NOTE);
  if (hasAccount && hasRealImport) return data; // already fully up to date

  // Drop the earlier placeholder transactions (from the retirement-planner file) and the v1 import
  // (which didn't track cleared status) now that we have the real register with correct cleared flags.
  transactions = transactions.filter(t => t.notes !== CINDY_PLACEHOLDER_NOTE && t.notes !== CINDY_IMPORT_NOTE_V1);

  const { account, transactions: importedTx } = buildCindyRegisterAdditions();
  accounts = hasAccount
    ? accounts.map(a => (a.id === CINDY_CC_ACCOUNT_ID || a.name === CINDY_CC_ACCOUNT_NAME) ? { ...a, balance: account.balance, institution: account.institution } : a)
    : [...accounts, account];
  transactions = [...importedTx, ...transactions].sort((a, b) => (a.date < b.date ? 1 : -1));
  budgets = {
    ...budgets,
    "Personal Support": budgets["Personal Support"] || DEFAULT_BUDGETS["Personal Support"],
    "Pets": budgets["Pets"] || DEFAULT_BUDGETS["Pets"],
    "Books": budgets["Books"] || DEFAULT_BUDGETS["Books"],
  };

  return { ...data, accounts, transactions, budgets };
}

function buildHouseholdRegisterAdditions() {
  function build(id, name, type, opening, imports) {
    const balance = Math.round((opening + imports.reduce((s, t) => s + t.amount, 0)) * 100) / 100;

    const transactions = imports.map(t => ({

      amount: t.amount, notes: HOUSEHOLD_IMPORT_NOTE, person: t.person, cleared: true,
    }));
    return { account, transactions };
  }
  const chk = build(CHK_ACCOUNT_ID, CHK_ACCOUNT_NAME, "checking", 0, CHK_REGISTER_IMPORT);

  const hysa = build(HYSA_ACCOUNT_ID, HYSA_ACCOUNT_NAME, "savings", 7249.58, HYSA_REGISTER_IMPORT);
  return {
    accounts: [chk.account, mike.account, savings.account, hysa.account],
    transactions: [...chk.transactions, ...mike.transactions, ...savings.transactions, ...hysa.transactions],
  };
}

function ensureHouseholdRegisters(data) {
  let accounts = data.accounts || [];
  let transactions = data.transactions || [];

  const householdIds = [CHK_ACCOUNT_ID, MIKE_ACCOUNT_ID, SAVINGS_ACCOUNT_ID, HYSA_ACCOUNT_ID];
  const hasAllAccounts = householdIds.every(id => accounts.some(a => a.id === id));
  const hasImport = transactions.some(t => t.notes === HOUSEHOLD_IMPORT_NOTE);
  if (hasAllAccounts && hasImport) return data; // already fully up to date

  const { accounts: newAccounts, transactions: newTx } = buildHouseholdRegisterAdditions();
  newAccounts.forEach(na => {
    if (!accounts.some(a => a.id === na.id)) accounts = [...accounts, na];
  });
  if (!hasImport) {
    transactions = [...newTx, ...transactions].sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  return { ...data, accounts, transactions };
}

function ensureUserNamedSubscriptions(data) {
  let subscriptions = data.subscriptions || [];
  const hasAll = USER_NAMED_SUBSCRIPTIONS.every(s => subscriptions.some(x => x.id === s.id));
  if (hasAll) return data;
  USER_NAMED_SUBSCRIPTIONS.forEach(s => {
    if (!subscriptions.some(x => x.id === s.id)) subscriptions = [...subscriptions, s];
  });
  return { ...data, subscriptions };
}

function buildDiscoverRegisterAdditions() {
  const balance = Math.round(DISCOVER_REGISTER_IMPORT.reduce((s, t) => s + t.amount, 0) * 100) / 100;
  const account = { id: DISCOVER_ACCOUNT_ID, name: DISCOVER_ACCOUNT_NAME, institution: "Discover", type: "credit", balance, openingBalance: 0 };
  const transactions = DISCOVER_REGISTER_IMPORT.map(t => ({
    id: uid(), date: t.date, accountId: DISCOVER_ACCOUNT_ID, merchant: t.merchant,
    category: t.category, amount: t.amount, notes: DISCOVER_IMPORT_NOTE, person: t.person, cleared: true,
  }));
  const subscriptions = DISCOVER_SUBSCRIPTIONS_FOUND.map(s => ({
    id: s.id, merchant: s.merchant, category: s.category, cadence: "Monthly", amount: s.amount,
    dayOfMonth: s.dayOfMonth, active: s.active, priceHistory: [{ date: s.lastDate, amount: s.amount }], person: s.person,
  }));
  return { account, transactions, subscriptions };
}

function ensureDiscoverRegister(data) {
  let accounts = data.accounts || [];
  let transactions = data.transactions || [];
  let subscriptions = data.subscriptions || [];

  const hasAccount = accounts.some(a => a.id === DISCOVER_ACCOUNT_ID || a.name === DISCOVER_ACCOUNT_NAME);
  const hasImport = transactions.some(t => t.notes === DISCOVER_IMPORT_NOTE);
  const hasSubs = DISCOVER_SUBSCRIPTIONS_FOUND.every(s => subscriptions.some(x => x.id === s.id));
  if (hasAccount && hasImport && hasSubs) return data; // already fully up to date

  const { account, transactions: importedTx, subscriptions: foundSubs } = buildDiscoverRegisterAdditions();
  accounts = hasAccount
    ? accounts.map(a => (a.id === DISCOVER_ACCOUNT_ID || a.name === DISCOVER_ACCOUNT_NAME) ? { ...a, balance: account.balance, institution: account.institution } : a)
    : [...accounts, account];
  if (!hasSubs) {
    foundSubs.forEach(s => { if (!subscriptions.some(x => x.id === s.id)) subscriptions = [...subscriptions, s]; });
  }
  if (!hasImport) {
    transactions = [...importedTx, ...transactions].sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  return { ...data, accounts, transactions, subscriptions };
}

function loadData() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data) data = generateSeedData();
  data = ensureCindyRegister(data);
  data = ensureHouseholdRegisters(data);
  data = ensureDiscoverRegister(data);
  data = ensureUserNamedSubscriptions(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function AddCategoryButton({ data, actions, onAdded }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [error, setError] = useState("");

  const openModal = () => { setName(""); setError(""); setOpen(true); };
  const close = () => setOpen(false);

  const save = () => {
    const trimmed = name.trim();
    if (!trimmed) { setError("Enter a category name."); return; }
    const existing = allExpenseCategories(data).map(c => c.toLowerCase());
    if (existing.includes(trimmed.toLowerCase())) { setError("That category already exists."); return; }
    actions.addCategory(trimmed);
    setOpen(false);
    if (onAdded) onAdded(trimmed);
  };

  return (
    <React.Fragment>
      <button
        type="button"
        title="Add a new category"
        onClick={openModal}
        className="w-8 h-8 shrink-0 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-indigo-600 flex items-center justify-center text-sm font-bold"
      >+</button>
      <Modal open={open} onClose={close} title="Add Category">
        <Field label="Category name">
          <input
            autoFocus
            placeholder="e.g. Kids' Activities"
            className={inputClass}
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") save(); }}
          />
        </Field>
        {error && <p className="text-sm text-rose-600 mb-3">{error}</p>}
        <div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={close}>Cancel</Button>
          <Button onClick={save}>Add Category</Button>
        </div>
      </Modal>
    </React.Fragment>
  );
}

/* ============================== DERIVED DATA HELPERS ============================== */

function useDerived(data) {
  return useMemo(() => {
    // Checking accounts are excluded from Net Worth — they're spending/cash-flow accounts,
    // not a store of wealth, per user preference.
    const netWorthAccounts = data.accounts.filter(a => a.type !== "checking");
    const netWorth = netWorthAccounts.reduce((s, a) => s + a.balance, 0);
    const totalAssets = data.accounts.filter(a => a.balance > 0).reduce((s, a) => s + a.balance, 0);
    const totalDebt = data.accounts.filter(a => a.balance < 0).reduce((s, a) => s + Math.abs(a.balance), 0);

    const now = new Date("2026-07-27T00:00:00");
    const curMonth = now.toISOString().slice(0, 7);

    const monthTx = data.transactions.filter(t => monthKey(t.date) === curMonth);
    const spendByCategory = {};
    const spendByPerson = { Joint: 0, Michael: 0, Cynthia: 0 };
    let monthIncome = 0, monthExpense = 0;
    monthTx.forEach(t => {
      if (t.category === "Transfer") return;
      if (t.amount > 0) monthIncome += t.amount;
      else {
        monthExpense += -t.amount;
        spendByCategory[t.category] = (spendByCategory[t.category] || 0) + (-t.amount);
        const p = t.person || "Joint";
        spendByPerson[p] = (spendByPerson[p] || 0) + (-t.amount);
      }
    });

    const savingsRate = monthIncome > 0 ? ((monthIncome - monthExpense) / monthIncome) * 100 : 0;

    // Budget alerts — categories at or above 85% of their monthly budget
    const budgetAlerts = EXPENSE_CATEGORIES
      .map(cat => ({ cat, budget: data.budgets[cat] || 0, spent: spendByCategory[cat] || 0 }))
      .filter(x => x.budget > 0 && x.spent / x.budget >= 0.85)
      .map(x => ({ ...x, pct: (x.spent / x.budget) * 100, over: x.spent > x.budget }));

    // Safe to spend — checking balance minus bills/subscriptions still due this month
    const todayDay = now.getDate();
    const paidForMonth = (data.paidBills && data.paidBills[curMonth]) || {};
    const recurringItems = [
      ...(data.recurringBills || []).map(b => ({ ...b, paid: !!paidForMonth[b.id] })),
      // Non-monthly subscriptions (Quarterly/Semi-Annual/Annual) only count toward this
      // month's bills/Safe-to-Spend when they're actually due this month — otherwise a
      // once-a-year charge would wrongly look like it's owed every single month.
      ...data.subscriptions.filter(s => s.active && subDueInMonth(s, now.getFullYear(), now.getMonth() + 1)).map(s => ({ id: s.id, merchant: s.merchant, amount: s.amount, dayOfMonth: s.dayOfMonth, person: s.person, category: s.category, paid: !!paidForMonth[s.id] })),
    ];
    const upcomingBillsRemaining = recurringItems.filter(b => b.dayOfMonth > todayDay && !b.paid).reduce((s, b) => s + b.amount, 0);
    const checkingAccount = data.accounts.find(a => a.type === "checking");
    const safeToSpend = (checkingAccount ? checkingAccount.balance : 0) - upcomingBillsRemaining;

    // Monthly category totals for trend charts
    const monthlyCategoryTotals = {};
    data.transactions.forEach(t => {
      if (t.category === "Transfer" || t.amount > 0) return;
      const mk = monthKey(t.date);
      monthlyCategoryTotals[mk] = monthlyCategoryTotals[mk] || {};
      monthlyCategoryTotals[mk][t.category] = (monthlyCategoryTotals[mk][t.category] || 0) + (-t.amount);
    });
    const trendMonths = Object.keys(monthlyCategoryTotals).sort();

    // Financial wellness score (0-100) — savings rate, budget adherence, debt-to-income, emergency fund coverage
    const clamp = (v) => Math.max(0, Math.min(100, v));
    const savingsScore = clamp((savingsRate / 20) * 100);
    const budgetableCount = EXPENSE_CATEGORIES.filter(c => (data.budgets[c] || 0) > 0).length;
    const withinBudgetCount = EXPENSE_CATEGORIES.filter(c => (data.budgets[c] || 0) > 0 && (spendByCategory[c] || 0) <= (data.budgets[c] || 0)).length;
    const budgetScore = budgetableCount > 0 ? clamp((withinBudgetCount / budgetableCount) * 100) : 100;
    const annualIncome = monthIncome * 12;
    const debtToIncome = annualIncome > 0 ? totalDebt / annualIncome : 0;
    const debtScore = clamp(100 - debtToIncome * 150);
    const savingsAccount = data.accounts.find(a => a.type === "savings");
    const monthsCovered = monthExpense > 0 ? (savingsAccount ? savingsAccount.balance : 0) / monthExpense : 0;
    const emergencyScore = clamp((monthsCovered / 6) * 100);
    const wellnessScore = Math.round(savingsScore * 0.35 + budgetScore * 0.25 + debtScore * 0.20 + emergencyScore * 0.20);
    const wellnessFactors = [
      { label: "Savings rate", score: Math.round(savingsScore), detail: `${savingsRate.toFixed(0)}% of income saved (target 20%)` },
      { label: "Budget adherence", score: Math.round(budgetScore), detail: `${withinBudgetCount}/${budgetableCount} categories within budget` },
      { label: "Debt-to-income", score: Math.round(debtScore), detail: `${(debtToIncome * 100).toFixed(0)}% of annual income owed` },
      { label: "Emergency fund", score: Math.round(emergencyScore), detail: `${monthsCovered.toFixed(1)} months of expenses saved (target 6)` },
    ];

    return {
      netWorth, totalAssets, totalDebt, curMonth, monthTx, spendByCategory, spendByPerson,
      monthIncome, monthExpense, savingsRate, budgetAlerts, recurringItems, upcomingBillsRemaining,
      safeToSpend, checkingAccount, monthlyCategoryTotals, trendMonths, wellnessScore, wellnessFactors,
    };
  }, [data]);
}

function TransactionModal({ open, onClose, onSave, initial, accounts, rules, defaultAccountId }) {
  const blank = { date: "2026-07-27", accountId: defaultAccountId || accounts[0]?.id || "", merchant: "", category: defaultAccountId === CINDY_CC_ACCOUNT_ID ? "Personal Support" : "Other", amount: "", notes: "", person: defaultAccountId === CINDY_CC_ACCOUNT_ID ? "Cynthia" : "Joint", receipt: null };
  const [form, setForm] = useState(initial || blank);
  const [receiptBusy, setReceiptBusy] = useState(false);
  useEffect(() => { setForm(initial || blank); }, [initial, open, defaultAccountId]);

  const onMerchantChange = (val) => {
    let next = { ...form, merchant: val };
    if (!initial) {
      const match = (rules || []).find(r => val.toLowerCase().includes(r.keyword.toLowerCase()));
      if (match) next.category = match.category;
    }
    setForm(next);
  };

  const onReceiptChange = async (file) => {
    if (!file) return;
    setReceiptBusy(true);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      setForm(f => ({ ...f, receipt: dataUrl }));
    } catch (e) {}
    setReceiptBusy(false);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.merchant || !form.amount) return;
    onSave({ ...form, amount: parseFloat(form.amount) });
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Transaction" : "Add Transaction"}>
      <form onSubmit={submit}>
        <Field label="Merchant">
          <input className={inputClass} value={form.merchant} onChange={e => onMerchantChange(e.target.value)} required />
        </Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Amount ($, negative = expense)">
            <input type="number" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
          </Field>
          <Field label="Date">
            <input type="date" className={inputClass} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required />
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Category">
            <select className={inputClass} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
              {Object.keys(CATEGORY_META).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Account">
            <select className={inputClass} value={form.accountId} onChange={e => setForm({ ...form, accountId: e.target.value })}>
              {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Person">
          <select className={inputClass} value={form.person || "Joint"} onChange={e => setForm({ ...form, person: e.target.value })}>
            {PEOPLE.map(p => <option key={p} value={p}>{PEOPLE_META[p].icon} {p}</option>)}
          </select>
        </Field>
        <Field label="Notes (optional)">
          <input className={inputClass} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} />
        </Field>
        <Field label="Receipt (optional)">
          {form.receipt ? (
            <div className="flex items-center gap-3">
              <img src={form.receipt} className="w-16 h-16 object-cover rounded-lg border border-slate-200" alt="Receipt" />
              <button type="button" className="text-xs text-rose-500 font-medium" onClick={() => setForm({ ...form, receipt: null })}>Remove</button>
            </div>
          ) : (
            <input type="file" accept="image/*" className="text-sm" onChange={e => onReceiptChange(e.target.files[0])} />
          )}
          {receiptBusy && <div className="text-xs text-slate-400 mt-1">Processing image…</div>}
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={onClose} type="button">Cancel</Button>
          <Button type="submit">Save Transaction</Button>
        </div>
      </form>
    </Modal>
  );
}

    if (!keyword.trim()) return;
    actions.addRule({ id: uid(), keyword: keyword.trim(), category });
    setKeyword("");
  };

  return (
    <Card className="p-4">
      <button className="w-full flex items-center justify-between text-sm font-semibold text-slate-700" onClick={() => setOpen(o => !o)}>
        <span>⚙️ Auto-Categorization Rules ({(rules || []).length})</span>
        <span className="text-slate-400">{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div className="mt-4 space-y-3">
          <p className="text-xs text-slate-400">New transactions whose merchant contains a keyword are auto-categorized. Use "Apply to existing" to re-run rules on your current transactions.</p>
          <div className="space-y-2">
            {(rules || []).map(r => (
              <div key={r.id} className="flex items-center flex-wrap gap-2 justify-between text-sm bg-slate-50 rounded-lg px-3 py-2">
                <span className="text-slate-600">If merchant contains <span className="font-semibold text-slate-800">"{r.keyword}"</span> → {CATEGORY_META[r.category]?.icon} {r.category}</span>
                <button className="text-xs text-rose-500 font-medium shrink-0" onClick={() => actions.deleteRule(r.id)}>Remove</button>
              </div>
            ))}
            {(rules || []).length === 0 && <div className="text-sm text-slate-400">No rules yet.</div>}
          </div>
          <div className="flex flex-wrap gap-2 items-center pt-2 border-t border-slate-100">
            <input placeholder="Keyword, e.g. Starbucks" className={inputClass + " max-w-[200px]"} value={keyword} onChange={e => setKeyword(e.target.value)} />
            <select className={inputClass + " max-w-[200px]"} value={category} onChange={e => setCategory(e.target.value)}>
              {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <Button variant="secondary" className="text-xs px-3 py-1.5" onClick={addRule}>+ Add Rule</Button>
            <Button variant="secondary" className="text-xs px-3 py-1.5" onClick={actions.applyRules}>Apply to existing transactions</Button>
          </div>
        </div>
      )}
    </Card>
  );
}

/* ============================== CINDY'S CREDIT CARD REGISTER ============================== */

function cindyRegType(t) {
  if (t.amount > 0) return t.category === "Transfer" ? "payment" : "return";
  return "expense";
}

const CINDY_TYPE_META = {
  expense: { label: "Expense", short: "Exp", tone: "red" },
  return:  { label: "Return",  short: "Ret", tone: "green" },
  payment: { label: "Payment", short: "Pay", tone: "indigo" },
};

function RegStat({ label, value, tone }) {
  const tones = {
    rose: "bg-rose-50 text-rose-700 border-rose-100",
    emerald: "bg-emerald-50 text-emerald-700 border-emerald-100",
    indigo: "bg-indigo-50 text-indigo-700 border-indigo-100",
    slate: "bg-slate-50 text-slate-700 border-slate-200",
    amber: "bg-amber-50 text-amber-700 border-amber-100",
    sky: "bg-sky-50 text-sky-700 border-sky-100",
  };
  return (
    <div className={"rounded-xl border p-3 " + (tones[tone] || tones.slate)}>
      <div className="text-[11px] uppercase tracking-wide font-medium opacity-70">{label}</div>
      <div className="text-base font-bold mt-0.5">{value}</div>
    </div>
  );
}

function CindyCreditCardRegister({ data, actions, cindyAccount }) {
  const blankForm = { id: null, date: isoDate(2026, 7, 27), desc: "", amount: "", category: EXPENSE_CATEGORIES[0], regType: "expense", who: "Cynthia", receipt: null };
  const [form, setForm] = useState(blankForm);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [typeFilter, setTypeFilter] = useState("All");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [unclearedFirst, setUnclearedFirst] = useState(false);
  const [notes, setNotes] = useState(data.cindyRegisterNotes || "");
  const [viewingReceipt, setViewingReceipt] = useState(null);
  const editFormRef = useRef(null);

  const allTx = useMemo(() => data.transactions.filter(t => t.accountId === cindyAccount.id), [data.transactions, cindyAccount.id]);

  const applyBalance = (nextList) => {
    const bal = Math.round(nextList.reduce((s, t) => s + t.amount, 0) * 100) / 100;
    actions.updateAccount({ ...cindyAccount, balance: bal });
  };

  const balanceById = useMemo(() => {
    const chron = [...allTx].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let running = 0;
    const map = {};
    chron.forEach(t => { running += -t.amount; map[t.id] = Math.round(running * 100) / 100; });
    return map;
  }, [allTx]);

  const clearedExpenses = allTx.filter(t => t.cleared !== false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  const clearedReturns = allTx.filter(t => t.cleared !== false && t.amount > 0 && t.category !== "Transfer").reduce((s, t) => s + t.amount, 0);
  const clearedPayments = allTx.filter(t => t.cleared !== false && t.amount > 0 && t.category === "Transfer").reduce((s, t) => s + t.amount, 0);
  const totalOwed = -allTx.reduce((s, t) => s + t.amount, 0);
  const unclearedCharges = allTx.filter(t => t.cleared === false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  const unclearedReturns = allTx.filter(t => t.cleared === false && t.amount > 0).reduce((s, t) => s + t.amount, 0);

  const filtered = useMemo(() => {
    return allTx.filter(t => {
      if (search && !t.merchant.toLowerCase().includes(search.toLowerCase())) return false;
      if (catFilter !== "All" && t.category !== catFilter) return false;
      if (typeFilter !== "All" && cindyRegType(t) !== typeFilter) return false;
      if (fromDate && t.date < fromDate) return false;
      if (toDate && t.date > toDate) return false;
      return true;
    });
  }, [allTx, search, catFilter, typeFilter, fromDate, toDate]);

  const sorted = useMemo(() => {
    const byDateDesc = [...filtered].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    if (!unclearedFirst) return byDateDesc;
    return [...byDateDesc.filter(t => t.cleared === false), ...byDateDesc.filter(t => t.cleared !== false)];
  }, [filtered, unclearedFirst]);

  const resetForm = () => setForm(blankForm);

  const startEdit = (t) => {
    setForm({
      id: t.id, date: t.date, desc: t.merchant, amount: String(Math.abs(t.amount)),
      category: t.category === "Transfer" ? EXPENSE_CATEGORIES[0] : t.category,
      regType: cindyRegType(t), who: t.person || "Cynthia", receipt: t.receipt || null,
    });
    if (editFormRef.current && typeof editFormRef.current.scrollIntoView === "function") editFormRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const submit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const category = form.regType === "payment" ? "Transfer" : form.category;
    const amount = form.regType === "expense" ? -Math.abs(amt) : Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    const payload = {
      id: form.id || uid(), date: form.date, accountId: cindyAccount.id, merchant: form.desc.trim(),
      category, amount, person: form.who, notes: existing ? (existing.notes || "") : "",
      cleared: existing ? existing.cleared : false, receipt: form.receipt || null,
    };
    if (form.id) {
      actions.updateTransaction(payload);
      applyBalance(allTx.map(t => t.id === payload.id ? payload : t));
    } else {
      actions.addTransaction(payload);
      applyBalance([...allTx, payload]);
    }
    resetForm();
  };

  const toggleCleared = (t) => actions.updateTransaction({ ...t, cleared: t.cleared === false ? true : false });

  const removeTx = (id) => {

        </div>
      </div>

      <div className="p-4 md:p-5 space-y-5">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 md:gap-3">
          <RegStat label="Cleared Expenses" value={fmtCurrency(clearedExpenses)} tone="rose" />
          <RegStat label="Cleared Returns" value={fmtCurrency(clearedReturns)} tone="emerald" />
          <RegStat label="Cleared Payments" value={fmtCurrency(clearedPayments)} tone="indigo" />
          <RegStat label="Total Owed" value={fmtCurrency(totalOwed, { decimals: false })} tone="slate" />
          <RegStat label="Uncleared Charges" value={fmtCurrency(unclearedCharges)} tone="amber" />
          <RegStat label="Uncleared Returns" value={fmtCurrency(unclearedReturns)} tone="sky" />
        </div>

        <div ref={editFormRef} className={"border rounded-xl p-3 md:p-4 transition-colors " + (form.id ? "border-indigo-300 bg-indigo-50/40 ring-2 ring-indigo-100" : "border-slate-200")}>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">{form.id ? "✏️ Editing Transaction" : "Add Transaction"}</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            <input type="date" className={inputClass} value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            <input placeholder="Description" className={inputClass + " col-span-2 md:col-span-2"} value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} />
            <input type="number" step="0.01" min="0" placeholder="$0.00" className={inputClass} value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
            <select className={inputClass} disabled={form.regType === "payment"} value={form.regType === "payment" ? "Transfer" : form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
              {(form.regType === "payment" ? ["Transfer"] : allExpenseCategories(data)).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <div className="flex items-center gap-1">
              <button type="button" title="Attach receipt" className="w-9 h-9 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 shrink-0" onClick={() => document.getElementById("cindy-receipt-input").click()}>📎</button>
              <input id="cindy-receipt-input" type="file" accept="image/*" className="hidden" onChange={e => attachReceipt(e.target.files[0])} />
              {form.receipt && <button type="button" className="text-xs text-indigo-600" onClick={() => setViewingReceipt(form.receipt)}>view</button>}
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-3 mt-3">
            <div className="flex rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {["expense", "return", "payment"].map(rt => (
                <button
                  key={rt} type="button"
                  onClick={() => setForm(f => ({ ...f, regType: rt }))}
                  className={"px-3 py-2 " + (form.regType === rt

              ))}
            </div>
            <div className="flex rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {[{ v: "Michael", label: "🧔 ME" }, { v: "Cynthia", label: "👩 WIFE" }, { v: "Joint", label: "🤝 JOINT" }].map(opt => (
                <button
                  key={opt.v} type="button"
                  onClick={() => setForm(f => ({ ...f, who: opt.v }))}
                  className={"px-3 py-2 " + (form.who === opt.v ? "bg-slate-800 text-white" : "bg-white text-slate-500 hover:bg-slate-50")}

            <div className="flex items-center gap-2 ml-auto">

          <select className={inputClass + " max-w-[140px]"} value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>

            <option value="expense">Expense</option>
            <option value="return">Return</option>

          </select>
          <input type="date" className={inputClass + " max-w-[150px]"} value={fromDate} onChange={e => setFromDate(e.target.value)} />

                <th className="text-left px-3 py-3 font-medium">Description</th>
                <th className="text-left px-3 py-3 font-medium">Category</th>
                <th className="text-left px-3 py-3 font-medium">Type</th>
                <th className="text-right px-3 py-3 font-medium">Balance</th>

            </thead>
            <tbody>

                const rt = cindyRegType(t);
                const isCleared = t.cleared !== false;
                const debtAmount = rt === "expense" ? Math.abs(t.amount) : -Math.abs(t.amount);
                return (
                  <tr key={t.id} className={"border-t border-slate-100 hover:bg-slate-50 group " + (isCleared ? "" : "bg-amber-50/40")}>
                    <td className="px-3 py-3">
                      <input type="checkbox" checked={isCleared} onChange={() => toggleCleared(t)} title={isCleared ? "Cleared" : "Uncleared"} className="w-4 h-4 accent-indigo-600" />
                    </td>
                    <td className="px-3 py-3 text-slate-500 whitespace-nowrap">{fmtDateShort(t.date)}</td>
                    <td className="px-3 py-3 font-medium text-slate-700">
                      <div className="flex items-center gap-2">
                        <MerchantAvatar merchant={t.merchant} category={t.category} size={24} />
                        <div>

                          <div className={"text-xs font-semibold " + (debtAmount > 0 ? "text-rose-600" : "text-emerald-600")}>
                            {debtAmount > 0 ? "+" : "-"}{fmtCurrency(Math.abs(debtAmount))}
                          </div>
                        </div>
                        {t.receipt && (
                          <button type="button" title="View receipt" className="text-slate-400 hover:text-indigo-600" onClick={() => setViewingReceipt(t.receipt)}>📎</button>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-3"><Pill tone="slate">{t.category}</Pill></td>
                    <td className="px-3 py-3"><Pill tone={CINDY_TYPE_META[rt].tone}>{CINDY_TYPE_META[rt].short}</Pill></td>
                    <td className="px-3 py-3 text-right font-semibold text-slate-700 whitespace-nowrap">{fmtCurrency(balanceById[t.id] ?? 0, { decimals: false })}</td>
                    <td className="px-3 py-3 text-right opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity whitespace-nowrap">
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Edit" onClick={() => startEdit(t)}>✏️</button>
                      <button className="text-slate-400 hover:text-rose-500" title="Delete" onClick={() => removeTx(t.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
              {sorted.length === 0 && (
                <tr><td colSpan="7" className="text-center py-10 text-slate-400">No transactions match your filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={!!viewingReceipt} onClose={() => setViewingReceipt(null)} title="Receipt">
        {viewingReceipt && <img src={viewingReceipt} className="w-full rounded-lg" alt="Receipt" />}
      </Modal>
    </Card>
  );
}

/* ============================== BANK ACCOUNT REGISTER (Checking / Savings / HYSA) ============================== */

function defaultPersonForAccount(accountId) {
  if (accountId === CHK_ACCOUNT_ID) return "Cynthia";
  if (accountId === MIKE_ACCOUNT_ID) return "Michael";
  return "Joint";
}

function BankAccountRegister({ data, actions, account }) {
  const blankForm = { id: null, date: isoDate(2026, 7, 27), desc: "", amount: "", category: "Other", direction: "withdrawal", receipt: null };
  const [form, setForm] = useState(blankForm);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [dirFilter, setDirFilter] = useState("All");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [unclearedFirst, setUnclearedFirst] = useState(false);
  const [notes, setNotes] = useState((data.registerNotes && data.registerNotes[account.id]) || "");
  const [viewingReceipt, setViewingReceipt] = useState(null);
  const editFormRef = useRef(null);

  const opening = account.openingBalance || 0;
  const allTx = useMemo(() => data.transactions.filter(t => t.accountId === account.id), [data.transactions, account.id]);

  const applyBalance = (nextList) => {
    const bal = Math.round((opening + nextList.reduce((s, t) => s + t.amount, 0)) * 100) / 100;
    actions.updateAccount({ ...account, balance: bal });
  };

  const balanceById = useMemo(() => {
    const chron = [...allTx].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let running = opening;
    const map = {};
    chron.forEach(t => { running += t.amount; map[t.id] = Math.round(running * 100) / 100; });
    return map;
  }, [allTx, opening]);

  const clearedDeposits = allTx.filter(t => t.cleared !== false && t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const clearedWithdrawals = allTx.filter(t => t.cleared !== false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  const availableBalance = Math.round((opening + allTx.filter(t => t.cleared !== false).reduce((s, t) => s + t.amount, 0)) * 100) / 100;
  const totalBalance = Math.round((opening + allTx.reduce((s, t) => s + t.amount, 0)) * 100) / 100;
  const unclearedDeposits = allTx.filter(t => t.cleared === false && t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const unclearedWithdrawals = allTx.filter(t => t.cleared === false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);

  const filtered = useMemo(() => {
    return allTx.filter(t => {
      if (search && !t.merchant.toLowerCase().includes(search.toLowerCase())) return false;
      if (catFilter !== "All" && t.category !== catFilter) return false;
      if (dirFilter !== "All" && (t.amount > 0 ? "deposit" : "withdrawal") !== dirFilter) return false;
      if (fromDate && t.date < fromDate) return false;
      if (toDate && t.date > toDate) return false;
      return true;
    });
  }, [allTx, search, catFilter, dirFilter, fromDate, toDate]);

  const sorted = useMemo(() => {
    const byDateDesc = [...filtered].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    if (!unclearedFirst) return byDateDesc;
    return [...byDateDesc.filter(t => t.cleared === false), ...byDateDesc.filter(t => t.cleared !== false)];
  }, [filtered, unclearedFirst]);

  const resetForm = () => setForm(blankForm);

  const startEdit = (t) => {
    setForm({
      id: t.id, date: t.date, desc: t.merchant, amount: String(Math.abs(t.amount)),
      category: t.category, direction: t.amount > 0 ? "deposit" : "withdrawal", receipt: t.receipt || null,
    });
    if (editFormRef.current && typeof editFormRef.current.scrollIntoView === "function") editFormRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const submit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const amount = form.direction === "deposit" ? Math.abs(amt) : -Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    const payload = {
      id: form.id || uid(), date: form.date, accountId: account.id, merchant: form.desc.trim(),
      category: form.category, amount, person: existing ? (existing.person || defaultPersonForAccount(account.id)) : defaultPersonForAccount(account.id),
      notes: existing ? (existing.notes || "") : "", cleared: existing ? existing.cleared : false, receipt: form.receipt || null,
    };
    if (form.id) {
      actions.updateTransaction(payload);
      applyBalance(allTx.map(t => t.id === payload.id ? payload : t));
    } else {
      actions.addTransaction(payload);
      applyBalance([...allTx, payload]);
    }
    resetForm();
  };

  const toggleCleared = (t) => actions.updateTransaction({ ...t, cleared: t.cleared === false ? true : false });

  const removeTx = (id) => {
    if (!window.confirm("Delete this transaction?")) return;
    actions.deleteTransaction(id);
    applyBalance(allTx.filter(t => t.id !== id));
    if (form.id === id) resetForm();
  };

  const clearAll = () => {
    if (!window.confirm(`Mark all ${allTx.length} transactions as cleared?`)) return;
    allTx.forEach(t => { if (t.cleared === false) actions.updateTransaction({ ...t, cleared: true }); });
  };

  const saveNotes = (val) => { setNotes(val); actions.setRegisterNotes(account.id, val); };

  const attachReceipt = async (file) => {
    if (!file) return;
    try { const dataUrl = await fileToCompressedDataUrl(file); setForm(f => ({ ...f, receipt: dataUrl })); } catch (e) {}
  };

  const clearFilters = () => { setSearch(""); setCatFilter("All"); setDirFilter("All"); setFromDate(""); setToDate(""); };
  const accountsById = { [account.id]: account };

  return (
    <Card className="overflow-hidden">
      <div className="bg-gradient-to-r from-teal-600 to-indigo-600 text-white p-5 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl shrink-0">{ACCOUNT_TYPE_META[account.type].icon}</div>
          <div>
            <div className="font-bold text-lg leading-tight">{account.name}</div>
            <div className="text-xs text-teal-100">{account.name} · {account.institution}</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-xs text-teal-100 uppercase tracking-wide">Balance</div>
          <div className="text-2xl font-bold">{fmtCurrency(totalBalance, { decimals: false })}</div>
        </div>
      </div>

      <div className="p-4 md:p-5 space-y-5">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 md:gap-3">
          <RegStat label="Cleared Deposits" value={fmtCurrency(clearedDeposits)} tone="emerald" />
          <RegStat label="Cleared Withdrawals" value={fmtCurrency(clearedWithdrawals)} tone="rose" />
          <RegStat label="Available Balance" value={fmtCurrency(availableBalance, { decimals: false })} tone="indigo" />
          <RegStat label="Total Balance" value={fmtCurrency(totalBalance, { decimals: false })} tone="slate" />
          <RegStat label="Uncleared Deposits" value={fmtCurrency(unclearedDeposits)} tone="sky" />
          <RegStat label="Uncleared Withdrawals" value={fmtCurrency(unclearedWithdrawals)} tone="amber" />
        </div>

        <div ref={editFormRef} className={"border rounded-xl p-3 md:p-4 transition-colors " + (form.id ? "border-indigo-300 bg-indigo-50/40 ring-2 ring-indigo-100" : "border-slate-200")}>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">{form.id ? "✏️ Editing Transaction" : "Add Transaction"}</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            <input type="date" className={inputClass} value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            <input placeholder="Description" className={inputClass + " col-span-2 md:col-span-2"} value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} />
            <input type="number" step="0.01" min="0" placeholder="$0.00" className={inputClass} value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
            <select className={inputClass} value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
              {allCategoriesFull(data).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <div className="flex items-center gap-1">
              <button type="button" title="Attach receipt" className="w-9 h-9 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 shrink-0" onClick={() => document.getElementById("bank-receipt-input-" + account.id).click()}>📎</button>
              <input id={"bank-receipt-input-" + account.id} type="file" accept="image/*" className="hidden" onChange={e => attachReceipt(e.target.files[0])} />
              {form.receipt && <button type="button" className="text-xs text-indigo-600" onClick={() => setViewingReceipt(form.receipt)}>view</button>}
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-3 mt-3">
            <div className="flex rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {["withdrawal", "deposit"].map(d => (
                <button
                  key={d} type="button"
                  onClick={() => setForm(f => ({ ...f, direction: d }))}
                  className={"px-3 py-2 " + (form.direction === d
                    ? (d === "withdrawal" ? "bg-rose-600 text-white" : "bg-emerald-600 text-white")
                    : "bg-white text-slate-500 hover:bg-slate-50")}
                >{d === "withdrawal" ? "WITHDRAWAL" : "DEPOSIT"}</button>
              ))}
            </div>
            <div className="flex items-center gap-2 ml-auto">
              {form.id && <button type="button" className="text-xs text-slate-500 font-medium" onClick={resetForm}>Cancel</button>}
              <Button className="text-xs px-4 py-2" onClick={submit}>{form.id ? "Update" : "+ Add"}</Button>
            </div>
          </div>
        </div>

        <div className="flex flex-wrap gap-2 items-center">
          <input placeholder="Search description..." className={inputClass + " max-w-[180px]"} value={search} onChange={e => setSearch(e.target.value)} />
          <select className={inputClass + " max-w-[160px]"} value={catFilter} onChange={e => setCatFilter(e.target.value)}>
            <option value="All">All Categories</option>
            {allCategoriesFull(data).map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <AddCategoryButton data={data} actions={actions} />
          <select className={inputClass + " max-w-[140px]"} value={dirFilter} onChange={e => setDirFilter(e.target.value)}>
            <option value="All">All Types</option>
            <option value="deposit">Deposit</option>
            <option value="withdrawal">Withdrawal</option>
          </select>
          <input type="date" className={inputClass + " max-w-[150px]"} value={fromDate} onChange={e => setFromDate(e.target.value)} />
          <span className="text-xs text-slate-400">to</span>
          <input type="date" className={inputClass + " max-w-[150px]"} value={toDate} onChange={e => setToDate(e.target.value)} />
          {(search || catFilter !== "All" || dirFilter !== "All" || fromDate || toDate) && (
            <button className="text-xs text-indigo-600 font-medium" onClick={clearFilters}>Clear</button>
          )}
          <Button variant="secondary" className="text-xs px-3 py-1.5 ml-auto" onClick={() => exportTransactionsCSV(sorted, accountsById)}>⬇ Export CSV</Button>
        </div>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-semibold text-amber-800">📝 NOTES</span>
            <span className="text-xs text-amber-600">auto-saved</span>
          </div>
          <textarea
            className="w-full bg-transparent text-sm text-amber-900 placeholder-amber-400 focus:outline-none resize-none"
            rows={2} placeholder="Add a note for this register..."
            value={notes} onChange={e => saveNotes(e.target.value)}
          />
        </div>

        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="text-sm font-semibold text-slate-700">Transactions <span className="text-slate-400 font-normal">({sorted.length})</span></div>
          <div className="flex gap-2">
            <button
              onClick={() => setUnclearedFirst(u => !u)}
              className={"text-xs font-medium px-3 py-1.5 rounded-lg border " + (unclearedFirst ? "bg-amber-100 border-amber-300 text-amber-800" : "border-slate-200 text-slate-500 hover:bg-slate-50")}
            >⚠ Uncleared First</button>
            <button className="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" onClick={clearAll}>Clear All</button>
          </div>
        </div>

        <div className="overflow-x-auto border border-slate-100 rounded-xl">
          <table className="w-full text-sm min-w-[720px]">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
              <tr>
                <th className="text-left px-3 py-3 font-medium w-8"></th>
                <th className="text-left px-3 py-3 font-medium">Date</th>
                <th className="text-left px-3 py-3 font-medium">Description</th>
                <th className="text-left px-3 py-3 font-medium">Category</th>
                <th className="text-left px-3 py-3 font-medium">Type</th>
                <th className="text-right px-3 py-3 font-medium">Balance</th>
                <th className="px-3 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(t => {
                const isCleared = t.cleared !== false;
                const isDeposit = t.amount > 0;
                return (
                  <tr key={t.id} className={"border-t border-slate-100 hover:bg-slate-50 group " + (isCleared ? "" : "bg-amber-50/40")}>
                    <td className="px-3 py-3">
                      <input type="checkbox" checked={isCleared} onChange={() => toggleCleared(t)} title={isCleared ? "Cleared" : "Uncleared"} className="w-4 h-4 accent-indigo-600" />
                    </td>
                    <td className="px-3 py-3 text-slate-500 whitespace-nowrap">{fmtDateShort(t.date)}</td>
                    <td className="px-3 py-3 font-medium text-slate-700">
                      <div className="flex items-center gap-2">
                        <MerchantAvatar merchant={t.merchant} category={t.category} size={24} />
                        <div>
                          <div>{t.merchant}</div>
                          <div className={"text-xs font-semibold " + (isDeposit ? "text-emerald-600" : "text-rose-600")}>
                            {isDeposit ? "+" : "-"}{fmtCurrency(Math.abs(t.amount))}
                          </div>
                        </div>
                        {t.receipt && (
                          <button type="button" title="View receipt" className="text-slate-400 hover:text-indigo-600" onClick={() => setViewingReceipt(t.receipt)}>📎</button>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-3"><Pill tone="slate">{t.category}</Pill></td>
                    <td className="px-3 py-3"><Pill tone={isDeposit ? "green" : "red"}>{isDeposit ? "Deposit" : "Withdrawal"}</Pill></td>
                    <td className="px-3 py-3 text-right font-semibold text-slate-700 whitespace-nowrap">{fmtCurrency(balanceById[t.id] ?? 0, { decimals: false })}</td>
                    <td className="px-3 py-3 text-right opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity whitespace-nowrap">
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Edit" onClick={() => startEdit(t)}>✏️</button>
                      <button className="text-slate-400 hover:text-rose-500" title="Delete" onClick={() => removeTx(t.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
              {sorted.length === 0 && (
                <tr><td colSpan="7" className="text-center py-10 text-slate-400">No transactions match your filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={!!viewingReceipt} onClose={() => setViewingReceipt(null)} title="Receipt">
        {viewingReceipt && <img src={viewingReceipt} className="w-full rounded-lg" alt="Receipt" />}
      </Modal>
    </Card>
  );
}

  const tabs = [

    { key: "mike", label: "🏦 Mike's Checking", account: mikeAccount, kind: "bank" },
    { key: "savings", label: "🐷 Savings", account: savingsAccount, kind: "bank" },
    { key: "hysa", label: "💰 HYSA", account: hysaAccount, kind: "bank" },

const IMPORT_FIELD_LABELS = {
  date: "Date", description: "Description", amount: "Amount (signed)",
  debit: "Debit / Withdrawal", credit: "Credit / Deposit", category: "Category",
};

function ImportStatementModal({ open, onClose, data, actions }) {
  const [step, setStep] = useState("upload");
  const [accountId, setAccountId] = useState((data.accounts[0] && data.accounts[0].id) || "");
  const [fileName, setFileName] = useState("");
  const [rawRows, setRawRows] = useState([]);
  const [hasHeader, setHasHeader] = useState(true);
  const [mapping, setMapping] = useState({ date: null, description: null, amount: null, debit: null, credit: null, category: null });
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [importedCount, setImportedCount] = useState(0);
  const fileInputRef = useRef(null);

  const reset = () => {
    setStep("upload"); setFileName(""); setRawRows([]); setHasHeader(true);
    setMapping({ date: null, description: null, amount: null, debit: null, credit: null, category: null });
    setRows([]); setError(""); setImportedCount(0);
  };
  const close = () => { reset(); onClose(); };

  const openPicker = () => { setError(""); fileInputRef.current && fileInputRef.current.click(); };

  const handleFile = (file) => {
    if (!file) return;
    setError("");
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = parseCSV(String(e.target.result || ""));
        if (parsed.length === 0) { setError("That file doesn't look like a CSV — no rows found."); return; }
        setRawRows(parsed);
        setHasHeader(true);
        setMapping(guessColumnMapping(parsed[0]));
        setStep("mapping");
      } catch (err) {
        setError("Couldn't read that file. Make sure it's a CSV export from your bank or card issuer.");
      }
    };
    reader.onerror = () => setError("Couldn't read that file.");
    reader.readAsText(file);
  };

  const headers = rawRows[0] || [];
  const columnCount = headers.length;
  const mappingComplete = mapping.date != null && mapping.description != null && (mapping.amount != null || mapping.debit != null || mapping.credit != null);

  const buildReview = () => {
    const dataRows = hasHeader ? rawRows.slice(1) : rawRows;
    const existing = data.transactions;
    const built = dataRows.map((r, idx) => {
      const dateRaw = mapping.date != null ? r[mapping.date] : "";
      const desc = mapping.description != null ? r[mapping.description] : "";
      let amount = null;
      if (mapping.amount != null) {
        amount = parseAmountCell(r[mapping.amount]);
      } else {
        const debit = mapping.debit != null ? parseAmountCell(r[mapping.debit]) : null;
        const credit = mapping.credit != null ? parseAmountCell(r[mapping.credit]) : null;
        if (debit != null && debit !== 0) amount = -Math.abs(debit);
        else if (credit != null && credit !== 0) amount = Math.abs(credit);
      }
      const date = parseDateCell(dateRaw);
      const merchant = String(desc || "").trim();
      const rawCategory = mapping.category != null ? String(r[mapping.category] || "").trim() : "";
      const category = CATEGORY_META[rawCategory] ? rawCategory : guessCategoryFromRules(merchant, data.rules, amount || 0);
      const valid = !!date && !!merchant && amount != null && !isNaN(amount) && amount !== 0;
      const duplicate = valid ? isDuplicateTx({ date, merchant, amount }, existing, accountId) : false;
      return {
        key: "imp_" + idx,
        date, merchant, category,
        amount: amount == null ? "" : String(Math.abs(amount).toFixed(2)),
        direction: (amount || 0) >= 0 ? "deposit" : "withdrawal",
        include: valid && !duplicate,
        valid, duplicate,
      };
    });
    setRows(built);
    setStep("review");
  };

  const updateRow = (key, patch) => setRows(rs => rs.map(r => r.key === key ? { ...r, ...patch } : r));
  const toggleAll = (val) => setRows(rs => rs.map(r => r.valid ? { ...r, include: val } : r));

  const validRows = rows.filter(r => r.valid);
  const includedCount = rows.filter(r => r.include).length;
  const duplicateCount = rows.filter(r => r.duplicate).length;
  const invalidCount = rows.length - validRows.length;

  const doImport = () => {
    const amt = (r) => parseFloat(r.amount) || 0;
    const toImport = rows.filter(r => r.include && r.valid).map(r => ({
      id: uid(), date: r.date, accountId, merchant: r.merchant.trim(), category: r.category,
      amount: r.direction === "deposit" ? Math.abs(amt(r)) : -Math.abs(amt(r)),
      person: defaultPersonForAccount(accountId), notes: "", cleared: true, receipt: null,
    }));
    if (toImport.length === 0) { setError("Select at least one transaction to import."); return; }
    actions.importTransactions(toImport);
    setImportedCount(toImport.length);
    setStep("done");
  };

  const account = data.accounts.find(a => a.id === accountId);

  return (
    <Modal open={open} onClose={close} title="⬆ Import Statement" size="xl">
      {step === "upload" && (
        <div className="space-y-4">
          <p className="text-sm text-slate-500">Upload a CSV file exported from your bank or card issuer's online statement. You'll be able to review and edit every transaction before anything is added.</p>
          <Field label="Import into account">
            <select className={inputClass} value={accountId} onChange={e => setAccountId(e.target.value)}>
              {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </Field>
          <div className="border-2 border-dashed border-slate-200 rounded-xl p-8 text-center">
            <div className="text-3xl mb-2">📄</div>
            <input ref={fileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={e => handleFile(e.target.files[0])} />
            <Button onClick={openPicker}>Choose CSV File…</Button>
            <p className="text-xs text-slate-400 mt-3">Most banks let you export a statement or transaction range as a .csv file from their website.</p>
          </div>
          {error && <p className="text-sm text-rose-600">{error}</p>}
        </div>
      )}

      {step === "mapping" && (
        <div className="space-y-4">
          <p className="text-sm text-slate-500">
            Loaded <span className="font-semibold text-slate-700">{fileName}</span> — {rawRows.length} row{rawRows.length === 1 ? "" : "s"}, {columnCount} column{columnCount === 1 ? "" : "s"}.
            Confirm which column is which. We guessed based on your file's headers.
          </p>
          <label className="flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" checked={hasHeader} onChange={e => setHasHeader(e.target.checked)} className="w-4 h-4 accent-indigo-600" />
            First row is a header row (not a transaction)
          </label>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {Object.keys(IMPORT_FIELD_LABELS).map(field => (
              <Field key={field} label={IMPORT_FIELD_LABELS[field] + (field === "date" || field === "description" ? " *" : "")}>
                <select
                  className={inputClass}
                  value={mapping[field] == null ? "" : mapping[field]}
                  onChange={e => setMapping(m => ({ ...m, [field]: e.target.value === "" ? null : parseInt(e.target.value, 10) }))}
                >
                  <option value="">— Not in file —</option>
                  {headers.map((h, idx) => <option key={idx} value={idx}>{h && h.trim() ? h : "Column " + (idx + 1)}</option>)}
                </select>
              </Field>
            ))}
          </div>
          <p className="text-xs text-slate-400">* Required. Provide either a single signed Amount column, or separate Debit/Credit columns.</p>
          {error && <p className="text-sm text-rose-600">{error}</p>}
          <div className="flex justify-between pt-2">
            <Button variant="secondary" onClick={() => setStep("upload")}>Back</Button>
            <Button onClick={buildReview} disabled={!mappingComplete}>Continue →</Button>
          </div>
        </div>
      )}

      {step === "review" && (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <p className="text-sm text-slate-500">
              Review each transaction before importing into <span className="font-semibold text-slate-700">{account ? account.name : ""}</span>.
              {duplicateCount > 0 && <span className="text-amber-600"> {duplicateCount} possible duplicate{duplicateCount === 1 ? "" : "s"} unchecked.</span>}
              {invalidCount > 0 && <span className="text-rose-500"> {invalidCount} row{invalidCount === 1 ? "" : "s"} couldn't be parsed and will be skipped.</span>}
            </p>
            <div className="flex gap-2 shrink-0">
              <button className="text-xs text-indigo-600 font-medium" onClick={() => toggleAll(true)}>Select all</button>
              <button className="text-xs text-indigo-600 font-medium" onClick={() => toggleAll(false)}>Select none</button>
            </div>
          </div>

          <div className="overflow-x-auto border border-slate-100 rounded-xl max-h-[50vh]">
            <table className="w-full text-sm min-w-[760px]">
              <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide sticky top-0">
                <tr>
